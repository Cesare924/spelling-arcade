<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1e1b4b;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#1e1b4b;touch-action:none}
#top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));color:#fff}
#back{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:12px;font:700 16px system-ui,sans-serif;padding:9px 12px}
#score{flex:1;text-align:right;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wrap{position:absolute;left:0;right:0;top:52px;bottom:0;display:flex;align-items:center;justify-content:center;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
#cv{display:block;border-radius:18px;touch-action:none;background:#fff}
#ov{position:absolute;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;padding:16px}
#ov[hidden]{display:none}
.card{background:rgba(255,255,255,.97);border-radius:22px;padding:20px;text-align:center;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.card h3{margin:4px 0 8px;font-size:24px}
.card p{margin:6px 0;font-size:16px;line-height:1.35}
.btn{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px;font:800 17px system-ui,sans-serif;color:#fff;background:#7c3aed}
.btn.green{background:#16a34a}.btn.ghost{background:#ede9fe;color:#5b21b6}
.muted{color:#4c4f6b}.nb{color:#b45309;font-weight:800}
</style></head>
<body>
<div id="top"><button id="back" aria-label="Back to Arcade">← Arcade</button><div id="score"></div></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ov" hidden></div>
<script>
/* ---------- bridge to the app ---------- */
const INIT=window.__SS_INIT||{id:'derby',set:{diff:'normal',calm:false,sfx:true,voice:true,twice:false,grade:'23',cost:1,maxGames:0,maxMin:0},words:['cat','dog','sun'],sent:{},tokens:5,best:{},day:{games:0,ms:0},title:'Game',em:'🎮'};
const S={set:INIT.set,tokens:INIT.tokens,best:INIT.best};
const DAY={games:INIT.day.games,ms:INIT.day.ms};
function post(m){try{window.ReactNativeWebView.postMessage(JSON.stringify(m));}catch(e){}}
let msBuf=0;
function flushMs(){if(msBuf>0){post({t:'ms',ms:Math.round(msBuf)});msBuf=0;}}
setInterval(flushMs,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushMs();});

/* ---------- small helpers the games use ---------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const norm=w=>String(w||'').trim().toLowerCase().replace(/[’‘]/g,"'");
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const STARTERS={easy:['cat','dog','sun','hat','run','big','red','fish','jump','play']};
const allWords=()=>INIT.words.slice();
function builtinSent(w){return INIT.sent[norm(w)]||'';}
const DF=()=>({easy:.78,normal:1,hard:1.22}[S.set.diff]||1);
const TOL=()=>({easy:1.35,normal:1,hard:.8}[S.set.diff]||1);
/* speech goes to the app, which uses the phone's voices */
function speak(text,onFail,opt){if(!S.set.voice){if(onFail)onFail('muted');return false;}post({t:'speak',text:String(text),raw:!!(opt&&opt.raw)});return true;}

/* ---------- sound effects (Web Audio, same as the web version) ---------- */
let AC=null;
function ac(){
  if(!S.set.sfx)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,d,type,vol,when,slide){
  const a=ac();if(!a)return;
  const t=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,vol,when){
  const a=ac();if(!a)return;
  const t=a.currentTime+(when||0);
  const len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=buf;g.gain.value=vol||.15;
  s.connect(g);g.connect(a.destination);s.start(t);
}
const SFX={
  correct:()=>{tone(523,.13,'triangle',.14);tone(659,.13,'triangle',.14,.1);tone(784,.25,'triangle',.14,.2);},
  coin:()=>{tone(988,.08,'square',.06);tone(1319,.3,'square',.06,.08);},
  wrong:()=>tone(240,.3,'sawtooth',.06,0,150),
  swoosh:()=>noise(.14,.07),
  hit:()=>{tone(170,.08,'square',.16);noise(.12,.25);},
  hr:()=>{tone(170,.08,'square',.16);noise(.12,.3);[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.12,.15+i*.09));noise(1.2,.05,.2);},
  miss:()=>tone(160,.25,'sawtooth',.05,0,110),
  tick:()=>tone(420,.06,'square',.07),
  jump:()=>tone(380,.16,'sine',.12,0,820),
  bonk:()=>tone(130,.3,'square',.1,0,60),
  star:()=>tone(1150,.12,'sine',.1,0,1900),
  pop:()=>{noise(.07,.3);tone(620,.07,'sine',.1,0,180);},
  nope:()=>tone(210,.15,'triangle',.1),
  flip:()=>tone(720,.04,'sine',.06),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.09))
};
function sfx(n){try{SFX[n]&&SFX[n]();}catch(e){}}

/* ---------- engine ---------- */
const W=360,H=540;
const cv=$('#cv'),ctx=cv.getContext('2d');
let G=null,raf=0,last=0;
function fitCanvas(){
  const wrap=$('#wrap'),r=wrap.getBoundingClientRect();
  const w=Math.max(200,Math.min(r.width-12,(r.height-12)*W/H));
  cv.style.width=w+'px';cv.style.height=(w*H/W)+'px';
  const dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*H/W*dpr);
}
window.addEventListener('resize',fitCanvas);
function limitReason(){
  if(S.set.maxGames&&DAY.games>=S.set.maxGames)return `That's all ${S.set.maxGames} games for today. Come back tomorrow! 🌙`;
  if(S.set.maxMin&&DAY.ms>=S.set.maxMin*60000)return `Play time is up for today (${S.set.maxMin} min). Come back tomorrow! 🌙`;
  return '';
}
function loop(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  if(G){
    if(G.started&&!G.over){
      G.update(dt);
      DAY.ms+=dt*1000;msBuf+=dt*1000;
      if(S.set.maxMin&&DAY.ms>=S.set.maxMin*60000&&!G.over){G.over=true;G.timeUp=true;}
    }
    ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
    G.draw(ctx);
    $('#score').textContent=G.hud();
    if(G.over&&!G.ended){G.ended=true;endGame();}
  }
  raf=requestAnimationFrame(loop);
}
function makeGame(id){const g=GAMES[id]();g.id=id;g.started=false;g.ended=false;return g;}
function overlay(html){const o=$('#ov');o.innerHTML=html;o.hidden=false;}
function openGame(id){
  fitCanvas();G=makeGame(id);
  const lim=limitReason();
  overlay(`<div class="card"><h3>${INIT.em} ${INIT.title}</h3><p>${G.intro}</p>${lim?`<p class="nb">${lim}</p>`:S.tokens>=S.set.cost?`<button class="btn green" id="ovStart">Start! · ${S.set.cost} 🪙</button>`:`<p class="muted">You need ${plural(S.set.cost,'token')}. Spell words to earn more!</p>`}<button class="btn ghost" id="ovBack">Back to Arcade</button></div>`);
  const s=$('#ovStart');if(s)s.addEventListener('click',()=>beginGame(id));
  $('#ovBack').addEventListener('click',exit);
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function beginGame(id){
  if(limitReason()||S.tokens<S.set.cost){openGame(id);return;}
  S.tokens-=S.set.cost;DAY.games++;post({t:'spend',cost:S.set.cost});ac();
  G=makeGame(id);G.started=true;if(G.begin)G.begin();
  $('#ov').hidden=true;
}
function endGame(){
  flushMs();
  const id=G.id,score=Math.floor(G.score);
  const prev=S.best[id];const nb=prev==null||score>prev;
  if(nb)S.best[id]=score;
  post({t:'end',id,score});
  sfx('win');
  const lim=limitReason(),cost=S.set.cost;
  const again=lim?`<p class="nb">${lim}</p>`:S.tokens>=cost?`<button class="btn green" id="ovAgain">Play again · ${cost} 🪙</button>`:`<p class="muted">Out of tokens. Spell more words to earn more!</p>`;
  overlay(`<div class="card"><div style="font-size:52px">${G.timeUp?'⏰':nb&&prev!=null?'🏆':'🎉'}</div><h3>${G.timeUp?'Time for a break!':(G.endTitle||'Great game!')}</h3><p>Score: <b style="font-size:22px">${score}</b></p><p class="${nb&&prev!=null?'nb':'muted'}">${nb&&prev!=null?'New best score!':'Best: '+S.best[id]}</p>${again}<button class="btn ghost" id="ovArcade">Back to Arcade</button></div>`);
  const a=$('#ovAgain');if(a)a.addEventListener('click',()=>beginGame(id));
  $('#ovArcade').addEventListener('click',exit);
}
function exit(){flushMs();post({t:'exit'});}
$('#back').addEventListener('click',exit);
function cvPt(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!G||!G.started||G.over)return;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  const [x,y]=cvPt(e);G.tap(x,y);
});
cv.addEventListener('pointerup',()=>{if(G&&G.release)G.release();});
cv.addEventListener('pointercancel',()=>{if(G&&G.release)G.release();});
cv.addEventListener('pointermove',e=>{if(!G||!G.started||G.over||!G.move)return;e.preventDefault();const [x,y]=cvPt(e);G.move(x,y);});
window.addEventListener('keydown',e=>{if(G&&G.started&&!G.over&&G.key)G.key(e.key);});
</script>
<script>
/* drawing helpers */
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emo(c,ch,x,y,size,flip){c.save();c.fillStyle='#000';c.font=size+'px '+EMOJI_FONT;c.textAlign='center';c.textBaseline='middle';c.translate(x,y);if(flip)c.scale(-1,1);c.fillText(ch,0,0);c.restore();}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function burst(arr,x,y,colors,n,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.35+Math.random()*.8);arr.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7+Math.random()*.5,c:colors[i%colors.length],r:2+Math.random()*3});}}
function stepParts(arr,dt,grav){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=grav*dt;p.life-=dt;if(p.life<=0)arr.splice(i,1);}}
function drawParts(c,arr){for(const p of arr){c.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();}c.globalAlpha=1;}
function addPop(arr,text,x,y,color,size){const half=Math.min(170,String(text).length*(size||26)*.3+10);x=Math.max(half,Math.min(W-half,x));arr.push({text,x,y,color:color||'#fff',size:size||26,life:1.2});}
function stepPops(arr,dt){for(let i=arr.length-1;i>=0;i--){arr[i].y-=38*dt;arr[i].life-=dt;if(arr[i].life<=0)arr.splice(i,1);}}
function drawPops(c,arr){for(const p of arr){c.globalAlpha=Math.max(0,Math.min(1,p.life*2));c.font=`700 ${p.size}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=6;c.strokeStyle='rgba(30,27,75,.8)';c.strokeText(p.text,p.x,p.y);c.fillStyle=p.color;c.fillText(p.text,p.x,p.y);}c.globalAlpha=1;}
function drawCloud(c,x,y,s){c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(x,y,18*s,0,7);c.arc(x+20*s,y-10*s,22*s,0,7);c.arc(x+42*s,y,18*s,0,7);c.arc(x+20*s,y+6*s,18*s,0,7);c.fill();}
function label(c,text,x,y,size,color){c.font=`700 ${size}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=5;c.strokeStyle='rgba(30,27,75,.75)';c.strokeText(text,x,y);c.fillStyle=color||'#fff';c.fillText(text,x,y);}

/* ===== GAME 1: Home Run Derby (baseball) ===== */
function createDerby(){
  const PLATE_Y=478,SWEET=462,MX=180,MY=318,START_Y=MY-12;
  const g={over:false,score:0,pitch:0,total:10,hr:0,hits:0,state:'wait',timer:1.4,ball:null,swing:0,swinging:false,recover:0,swung:false,parts:[],pops:[],fly:null,fw:0,t:0,crowd:[]};
  const cc=['#f87171','#60a5fa','#fbbf24','#34d399','#a78bfa','#f472b6','#ffffff','#fb923c'];
  for(let i=0;i<90;i++)g.crowd.push({x:4+Math.random()*(W-8),y:44+Math.random()*54,c:cc[i%cc.length],ph:Math.random()*6});
  g.intro='Watch the pitcher throw. <b>Tap anywhere to swing</b> when the ball reaches the glowing yellow ring!<br><br>10 pitches. Home run = 3 points, base hit = 1.';
  g.hud=()=>`⚾ ${g.pitch}/${g.total} · 💥 ${g.hr} HR · ⭐ ${g.score}`;
  g.endTitle='Game over, slugger!';
  function pitch(){
    g.pitch++;
    const base=(1.25-Math.min(.35,g.pitch*.03))/DF(),slow=Math.random()<.2;
    g.ball={t:0,dur:base*(slow?1.35:1)*rnd(.9,1.1),curve:rnd(-25,25),x:MX,y:START_Y,r:4};
    g.state='pitch';g.swung=false;
  }
  function contact(kind,off){
    const b=g.ball,side=off<0?-1:1;g.state='fly';
    if(kind==='hr'){g.hr++;g.score+=3;g.fly={x:b.x,y:b.y,vx:rnd(-80,80),vy:-640,g:300,r:12,t:0,life:1.6};addPop(g.pops,'HOME RUN!',180,240,'#fde047',42);g.fw=1.8;sfx('hr');burst(g.parts,b.x,b.y,['#fff','#fde047'],18,220);}
    else if(kind==='hit'){g.hits++;g.score+=1;g.fly={x:b.x,y:b.y,vx:side*rnd(140,230),vy:-420,g:520,r:11,t:0,life:1.2};addPop(g.pops,'Base hit!',180,300,'#86efac',34);sfx('hit');burst(g.parts,b.x,b.y,['#fff','#86efac'],12,160);}
    else{g.fly={x:b.x,y:b.y,vx:side*330,vy:-260,g:400,r:10,t:0,life:.9};addPop(g.pops,'Foul ball!',180,320,'#e2e8f0',28);sfx('tick');}
  }
  g.tap=()=>{
    if(g.swinging||g.swing>0)return;
    g.swinging=true;g.swing=0;sfx('swoosh');
    if(g.state!=='pitch'||g.swung)return;
    g.swung=true;
    const b=g.ball,vy=(PLATE_Y-START_Y)/b.dur,off=(b.y+vy*.06)-SWEET,d=Math.abs(off);
    const T=TOL();if(d<14*T)contact('hr',off);else if(d<30*T)contact('hit',off);else if(d<44*T)contact('foul',off);
  };
  g.update=dt=>{
    g.t+=dt;stepParts(g.parts,dt,250);stepPops(g.pops,dt);
    if(g.swinging){g.swing=Math.min(1,g.swing+dt/.17);if(g.swing>=1){g.swinging=false;g.recover=.4;}}
    else if(g.recover>0){g.recover-=dt;if(g.recover<=0)g.swing=0;}
    if(g.fw>0){g.fw-=dt;if(Math.random()<dt*7)burst(g.parts,rnd(40,320),rnd(30,120),['#fde047','#f472b6','#60a5fa','#34d399','#fff'],26,170);}
    if(g.state==='wait'){g.timer-=dt;if(g.timer<=0){if(g.pitch>=g.total){g.over=true;return;}pitch();}}
    else if(g.state==='pitch'){
      const b=g.ball;b.t+=dt;const p=b.t/b.dur;
      b.y=START_Y+(PLATE_Y-START_Y)*p;b.x=MX+Math.sin(Math.min(p,1)*Math.PI)*b.curve;b.r=4+9*Math.min(p,1.2);
      if(b.y>H+20){g.state='wait';g.timer=1.2;addPop(g.pops,g.swung?'Swing and a miss!':'Strike!',180,390,'#fca5a5',30);sfx('miss');}
    }else if(g.state==='fly'){
      const f=g.fly;f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=f.g*dt;f.r=Math.max(2,f.r-dt*7);
      if(f.t>=f.life){g.state='wait';g.timer=1.1;g.fly=null;}
    }
  };
  function ball(c,x,y,r){
    c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();
    c.strokeStyle='#dc2626';c.lineWidth=Math.max(1,r*.16);
    c.beginPath();c.arc(x-r*1.15,y,r*.85,-.75,.75);c.stroke();
    c.beginPath();c.arc(x+r*1.15,y,r*.85,Math.PI-.75,Math.PI+.75);c.stroke();
  }
  function pitcher(c){
    const x=MX,y=MY,wind=(g.state==='wait'&&g.timer<.6&&g.pitch<g.total);
    const thrown=g.state==='pitch'&&g.ball&&g.ball.t<.25;
    c.fillStyle='#1e3a8a';c.fillRect(x-6,y-8,5,14);c.fillRect(x+1,y-8,5,14);
    c.fillStyle='#ef4444';c.beginPath();c.ellipse(x,y-17,9,11,0,0,7);c.fill();
    c.fillStyle='#8b5a2b';c.beginPath();c.arc(x-11,y-18,4,0,7);c.fill();
    c.strokeStyle='#f5c9a0';c.lineWidth=3.5;c.lineCap='round';c.beginPath();c.moveTo(x+7,y-22);
    if(wind)c.lineTo(x+13,y-38);else if(thrown)c.lineTo(x+4,y-6);else c.lineTo(x+12,y-12);c.stroke();
    c.fillStyle='#f5c9a0';c.beginPath();c.arc(x,y-33,7,0,7);c.fill();
    c.fillStyle='#1e3a8a';c.beginPath();c.arc(x,y-35,7.5,Math.PI,0);c.fill();c.fillRect(x-3,y-36,12,3);
  }
  function batter(c){
    const x=134,y=502;
    c.fillStyle='#f1f5f9';c.fillRect(x-11,y-36,9,34);c.fillRect(x+3,y-36,9,34);
    c.fillStyle='#111827';c.fillRect(x-14,y-5,13,7);c.fillRect(x+2,y-5,13,7);
    c.fillStyle='#7c3aed';c.beginPath();c.ellipse(x,y-52,16,21,0,0,7);c.fill();
    c.fillStyle='#fff';c.font='700 14px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('7',x-2,y-50);
    c.fillStyle='#f5c9a0';c.beginPath();c.arc(x+3,y-81,11,0,7);c.fill();
    c.fillStyle='#7c3aed';c.beginPath();c.arc(x+2,y-84,12,Math.PI,0);c.fill();c.fillRect(x+2,y-86,17,4);
    const s=g.swing,e=s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2;
    const a=-2.3+e*2.9,hx=x+13,hy=y-58;
    c.save();c.translate(hx,hy);c.rotate(a);
    c.fillStyle='#b45309';c.beginPath();c.moveTo(0,-2.5);c.lineTo(70,-5.5);c.arc(70,0,5.5,-Math.PI/2,Math.PI/2);c.lineTo(0,2.5);c.closePath();c.fill();
    c.fillStyle='#78350f';c.fillRect(-4,-3,12,6);
    c.restore();
    c.strokeStyle='#f5c9a0';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(x+8,y-64);c.lineTo(hx,hy);c.stroke();
  }
  g.draw=c=>{
    const sky=c.createLinearGradient(0,0,0,44);sky.addColorStop(0,'#0ea5e9');sky.addColorStop(1,'#7dd3fc');
    c.fillStyle=sky;c.fillRect(0,0,W,44);
    c.fillStyle='#334155';c.fillRect(0,36,W,70);

/* ===== GAME 2: Unicorn Rainbow Dash ===== */
function createUnicorn(){
  const GY=452;
  const g={over:false,score:0,t:0,speed:180,u:{x:84,y:GY,vy:0,j:0},hearts:3,inv:0,magic:0,obs:[],items:[],oT:1.6,iT:.6,parts:[],pops:[],trail:[],stars:0,shake:0,h1:0,h2:0,
    clouds:Array.from({length:5},(_,i)=>({x:i*90+Math.random()*40,y:40+Math.random()*120,s:.6+Math.random()*.6}))};

  g.hud=()=>`${'❤️'.repeat(Math.max(0,g.hearts))}${'🤍'.repeat(Math.max(0,3-g.hearts))} · ⭐ ${g.stars} · ${Math.floor(g.score)}`;
  g.endTitle='What a magical run!';
  g.tap=()=>{const u=g.u;if(u.j<2){u.vy=u.j?-470:-540;u.j++;sfx('jump');burst(g.parts,u.x,u.y,['#f9a8d4','#c4b5fd','#fde68a'],10,120);}};
  g.update=dt=>{
    g.t+=dt;g.speed=Math.min(400,180+g.t*5)*DF();const mv=g.speed*dt;g.score+=mv/12;
    const u=g.u;u.vy+=1500*dt;u.y+=u.vy*dt;if(u.y>=GY){u.y=GY;u.vy=0;u.j=0;}
    g.inv=Math.max(0,g.inv-dt);g.magic=Math.max(0,g.magic-dt);g.shake=Math.max(0,g.shake-dt);
    for(const cl of g.clouds){cl.x-=mv*.15*cl.s;if(cl.x<-90){cl.x=W+60;cl.y=30+Math.random()*130;}}

    g.oT-=dt;
    if(g.oT<=0){
      if(Math.random()<.62)g.obs.push({x:W+30,y:GY-16,k:Math.random()<.5?'🌵':'🪨',r:16});
      else g.obs.push({x:W+30,y:GY-122-Math.random()*36,k:'⛈️',r:20});

    }

    if(g.iT<=0){
      if(Math.random()<.09&&g.magic<=0)g.items.push({x:W+30,y:GY-150,k:'🌈',r:22,ph:0});
      else g.items.push({x:W+30,y:GY-30-Math.random()*170,k:'⭐',r:16,ph:Math.random()*6});
      g.iT=.5+Math.random()*.8;
    }
    for(const o of g.obs)o.x-=mv;
    for(const it of g.items)it.x-=mv;
    g.obs=g.obs.filter(o=>o.x>-40);
    g.items=g.items.filter(i=>i.x>-40&&!i.got);
    const hx=u.x+4,hy=u.y-28;
    for(const o of g.obs){
      if(o.hit)continue;
      const dx=o.x-hx,dy=o.y-hy;
      if(dx*dx+dy*dy<(o.r+19)*(o.r+19)){
        if(g.magic>0){o.hit=true;g.score+=5;burst(g.parts,o.x,o.y,['#f0abfc','#fde047','#a5f3fc'],14,160);addPop(g.pops,'+5 ✨',o.x,o.y-30,'#f0abfc',22);sfx('star');}
        else if(g.inv<=0){o.hit=true;g.hearts--;g.inv=1.3;g.shake=.3;sfx('bonk');addPop(g.pops,'Oops!',hx,hy-44,'#fca5a5',26);if(g.hearts<=0)g.over=true;}
      }
    }
    for(const it of g.items){
      const dx=it.x-hx,dy=it.y-hy;
      if(dx*dx+dy*dy<(it.r+24)*(it.r+24)){
        it.got=true;
        if(it.k==='🌈'){g.magic=5;g.score+=25;addPop(g.pops,'RAINBOW MAGIC!',180,190,'#f0abfc',32);sfx('win');}
        else{g.stars++;g.score+=10;addPop(g.pops,'+10',it.x,it.y-10,'#fde047',22);sfx('star');}
        burst(g.parts,it.x,it.y,['#fde047','#f9a8d4','#a5f3fc'],12,140);

    stepParts(g.parts,dt,200);stepPops(g.pops,dt);

  function hills(c,off,base,amp,freq,col){c.fillStyle=col;c.beginPath();c.moveTo(-10,H+10);for(let x=-10;x<=W+10;x+=10)c.lineTo(x,base-amp*(.6+.4*Math.sin((x+off)*freq)));c.lineTo(W+10,H+10);c.closePath();c.fill();}
  g.draw=c=>{
    c.save();
    if(g.shake>0&&!S.set.calm)c.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#c4b5fd');gr.addColorStop(.6,'#fbcfe8');gr.addColorStop(1,'#fde68a');
    c.fillStyle=gr;c.fillRect(-10,-10,W+20,H+20);
    c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(290,90,34,0,7);c.fill();
    for(const cl of g.clouds)drawCloud(c,cl.x,cl.y,cl.s);
    hills(c,g.h1,370,46,.012,'#a78bfa');hills(c,g.h2,415,30,.02,'#f0abfc');
    c.fillStyle='#86efac';c.fillRect(-10,GY+2,W+20,H);c.fillStyle='#4ade80';c.fillRect(-10,GY+2,W+20,8);
    for(let i=0;i<12;i++){const fx=((i*47-g.h2*2)%(W+40)+(W+40))%(W+40)-20;c.fillStyle=['#f472b6','#fde047','#fff'][i%3];c.beginPath();c.arc(fx,GY+26+(i%3)*14,3.2,0,7);c.fill();}
    const cols=['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#8b5cf6'];
    if(g.trail.length>1){
      c.lineCap='round';c.lineJoin='round';c.globalAlpha=.85;
      cols.forEach((col,k)=>{c.strokeStyle=col;c.lineWidth=4;c.beginPath();g.trail.forEach((p,i)=>{const yy=p.y-10+k*4;if(i)c.lineTo(p.x,yy);else c.moveTo(p.x,yy);});c.stroke();});
      c.globalAlpha=1;
    }
    for(const it of g.items)emo(c,it.k,it.x,it.y+Math.sin(g.t*4+it.ph)*5,it.k==='🌈'?40:30);
    for(const o of g.obs){c.globalAlpha=o.hit?.35:1;emo(c,o.k,o.x,o.y,o.k==='⛈️'?46:38);}
    c.globalAlpha=1;
    const u=g.u;
    if(!(g.inv>0&&Math.floor(g.inv*12)%2)){
      if(g.magic>0){c.fillStyle=`hsla(${(g.t*300)%360},90%,85%,.55)`;c.beginPath();c.arc(u.x,u.y-28,38+Math.sin(g.t*10)*3,0,7);c.fill();}
      const bob=u.y>=GY?-Math.abs(Math.sin(g.t*14))*4:0;
      emo(c,'🦄',u.x,u.y-30+bob,58,true);
    }
    drawParts(c,g.parts);drawPops(c,g.pops);
    if(g.magic>0)label(c,'✨ Rainbow magic: '+Math.ceil(g.magic)+' ✨',180,40,18,'#fff');
    c.restore();
  };
  return g;
}

/* ===== GAME 3: Balloon Spell Pop ===== */
function wordPool(){
  const p=allWords().map(norm).filter(w=>/^[a-z]+$/.test(w)&&w.length<=12);
  return p.length?p:STARTERS.easy.slice();
}
function createBalloon(){
  const pool=wordPool(),AB='abcdefghijklmnopqrstuvwxyz';
  const COLS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
  const BT={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const g={over:false,score:0,time:BT,tmax:BT,word:'',idx:0,bl:[],sT:0,parts:[],pops:[],done:0,t:0,wait:0,
    clouds:Array.from({length:4},(_,i)=>({x:i*100+Math.random()*30,y:140+Math.random()*300,s:.5+Math.random()*.5}))};
  g.intro='Spell the word at the top by <b>popping balloons in order</b>, one letter at a time. Each word you finish gives bonus points and extra time.<br><br>You have '+BT+' seconds!';
  g.hud=()=>`🎈 ${g.done} words · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='Time\'s up! Great popping!';
  function nextWord(){let w,n=0;do{w=pick(pool);n++;}while(pool.length>1&&w===g.word&&n<10);g.word=w;g.idx=0;speak(w);}
  const need=()=>g.word[g.idx];
  function spawn(l){g.bl.push({x:rnd(36,W-36),y:H+40,vy:-(55+Math.random()*35+Math.min(40,g.done*4))*DF(),r:28,l,c:pick(COLS),ph:Math.random()*6,wig:0});}
  g.begin=()=>{nextWord();for(let i=0;i<3;i++){spawn(i===0?need():pick(AB));g.bl[g.bl.length-1].y=H-40-i*120;}};
  g.tap=(x,y)=>{
    if(g.wait>0)return;
    let hit=null;
    for(let i=g.bl.length-1;i>=0;i--){const b=g.bl[i],dx=x-b.x,dy=y-b.y;if(dx*dx+dy*dy<(b.r+10)*(b.r+10)){hit=b;break;}}
    if(!hit)return;
    if(hit.l===need()){
      hit.popped=true;burst(g.parts,hit.x,hit.y,[hit.c,'#fff'],16,200);sfx('pop');g.idx++;g.score+=1;
      if(g.idx>=g.word.length){g.done++;g.score+=g.word.length;g.time=Math.min(99,g.time+4);addPop(g.pops,`${g.word.toUpperCase()}! +${g.word.length}`,180,200,'#fde047',34);sfx('win');g.wait=1.1;}
    }else{hit.wig=.4;sfx('nope');addPop(g.pops,'Find '+need().toUpperCase(),hit.x,hit.y-44,'#fff',20);}
  };
  g.update=dt=>{
    g.t+=dt;g.time-=dt;
    if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)nextWord();}
    g.sT-=dt;
    if(g.sT<=0){const n=need();spawn(n&&g.wait<=0&&Math.random()<.4?n:pick(AB));g.sT=.55+Math.random()*.35;}
    const n=need();
    if(n&&g.wait<=0&&!g.bl.some(b=>b.l===n&&!b.popped&&b.y>150))spawn(n);
    for(const b of g.bl){b.y+=b.vy*dt;b.x+=Math.sin(g.t*2+b.ph)*12*dt;b.wig=Math.max(0,b.wig-dt);}
    g.bl=g.bl.filter(b=>b.y>-80&&!b.popped);
    for(const cl of g.clouds){cl.x-=10*dt*cl.s;if(cl.x<-80)cl.x=W+40;}
    stepParts(g.parts,dt,300);stepPops(g.pops,dt);
  };
  function balloon(c,b){
    const x=b.x+(b.wig>0?Math.sin(b.wig*40)*5:0),y=b.y,ry=b.r*1.15;
    c.strokeStyle='rgba(71,85,105,.6)';c.lineWidth=1.5;c.beginPath();c.moveTo(x,y+ry+4);c.quadraticCurveTo(x+8*Math.sin(g.t*3+b.ph),y+ry+26,x,y+ry+46);c.stroke();
    c.fillStyle=b.c;c.beginPath();c.ellipse(x,y,b.r,ry,0,0,7);c.fill();
    c.beginPath();c.moveTo(x-5,y+ry+6);c.lineTo(x+5,y+ry+6);c.lineTo(x,y+ry-2);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(x-b.r*.38,y-b.r*.45,b.r*.2,b.r*.34,-.5,0,7);c.fill();
    c.font='700 28px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.25)';
    c.strokeText(b.l.toUpperCase(),x,y+1);c.fillStyle='#fff';c.fillText(b.l.toUpperCase(),x,y+1);
  }
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7dd3fc');gr.addColorStop(1,'#f0f9ff');
    c.fillStyle=gr;c.fillRect(0,0,W,H);
    for(const cl of g.clouds)drawCloud(c,cl.x,cl.y,cl.s);
    for(const b of g.bl)balloon(c,b);
    c.fillStyle='rgba(255,255,255,.95)';rr(c,10,10,W-20,84,18);c.fill();
    c.fillStyle='#6b7280';c.font='600 13px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText(g.started?'SPELL THIS WORD':'GET READY',180,26);
    const wd=g.word||'?',L=wd.length,bw=Math.min(34,(W-50)/L),x0=(W-bw*L)/2+bw/2;
    for(let i=0;i<L;i++){
      const x=x0+i*bw,ch=wd[i].toUpperCase();
      c.font=`700 ${Math.floor(bw*.95)}px Fredoka, sans-serif`;
      if(i<g.idx){c.fillStyle='#7c3aed';c.fillText(ch,x,58);}
      else{
        if(i===g.idx){c.fillStyle='#fde047';rr(c,x-bw/2+2,72,bw-4,6,3);c.fill();}
        c.fillStyle='#d1d5db';c.fillText(ch,x,58);
      }
    }
    const tf=Math.max(0,Math.min(1,g.time/g.tmax));
    c.fillStyle='rgba(255,255,255,.7)';rr(c,20,100,W-40,10,5);c.fill();
    c.fillStyle=tf>.3?'#22c55e':'#ef4444';rr(c,20,100,(W-40)*tf,10,5);c.fill();
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 4: Memory Match ===== */
function createMemory(){
  const EM=['🦄','⚾','🌈','🍦','🐶','🚀','🍕','🎈'].slice(0,S.set.diff==='easy'?6:8);
  const cards=shuffle(EM.concat(EM)).map(e=>({e,up:false,m:false,f:0}));
  const g={over:false,score:0,moves:0,pairs:0,open:[],lock:0,end:0,t:0,parts:[],pops:[],cards};
  const GX=16,GY0=70,GAP=10,CW=(W-2*GX-3*GAP)/4,CH=100;
  const pos=i=>({x:GX+(i%4)*(CW+GAP),y:GY0+Math.floor(i/4)*(CH+GAP)});
  g.intro='Tap two cards to flip them. If they match, they stay up! Find all <b>'+EM.length+' pairs</b> in as few moves as you can.';
  g.hud=()=>`🧠 Moves ${g.moves} · Pairs ${g.pairs}/${EM.length}`;
  g.endTitle='You found them all!';
  g.tap=(x,y)=>{
    if(g.lock>0||g.end>0)return;
    for(let i=0;i<cards.length;i++){
      const p=pos(i),cd=cards[i];
      if(x>=p.x&&x<=p.x+CW&&y>=p.y&&y<=p.y+CH){
        if(cd.up||cd.m)return;
        cd.up=true;sfx('flip');g.open.push(cd);
        if(g.open.length===2){
          g.moves++;const a=g.open[0],b=g.open[1];
          if(a.e===b.e){
            a.m=b.m=true;g.pairs++;g.open=[];sfx('correct');
            burst(g.parts,p.x+CW/2,p.y+CH/2,['#fde047','#f9a8d4','#a5f3fc'],18,180);
            if(g.pairs===EM.length){g.score=Math.max(10,140-g.moves*5);g.end=1.3;addPop(g.pops,'All matched!',180,280,'#fde047',38);}
          }else g.lock=.9;
        }
        return;
      }
    }
  };
  g.update=dt=>{
    g.t+=dt;
    for(const cd of cards){const tg=(cd.up||cd.m)?1:0;cd.f+=(tg-cd.f)*Math.min(1,dt*12);}
    if(g.lock>0){g.lock-=dt;if(g.lock<=0){g.open.forEach(cd=>cd.up=false);g.open=[];}}
    if(g.end>0){g.end-=dt;if(g.end<=0)g.over=true;}
    stepParts(g.parts,dt,250);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#4c1d95');gr.addColorStop(1,'#a855f7');
    c.fillStyle=gr;c.fillRect(0,0,W,H);
    label(c,'Find the pairs!',180,36,24,'#fde047');
    cards.forEach((cd,i)=>{
      const p=pos(i),s=Math.abs(1-2*cd.f),w=CW*Math.max(.04,s),cx=p.x+CW/2,face=cd.f>.5;
      c.fillStyle=face?(cd.m?'#dcfce7':'#ffffff'):'#f472b6';
      rr(c,cx-w/2,p.y,w,CH,12);c.fill();
      if(cd.m&&face){c.strokeStyle='#22c55e';c.lineWidth=3;rr(c,cx-w/2,p.y,w,CH,12);c.stroke();}
      if(s>.15){
        c.save();c.translate(cx,p.y+CH/2);c.scale(s,1);
        if(face)emo(c,cd.e,0,0,44);
        else{c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(0,0,22,0,7);c.fill();emo(c,'⭐',0,0,26);}
        c.restore();
      }
    });
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 5: Ice Cream Tower ===== */
function createIceCream(){
  const FL=['#f9a8d4','#92400e','#86efac','#fef3c7','#93c5fd','#fdba74','#c4b5fd'];
  const R=27,SP=30,CR=432,CX=180,SLIDE_Y=112;
  const g={over:false,score:0,stack:[],fall:null,misses:0,cam:0,t:0,ph:0,parts:[],pops:[],col:pick(FL),wait:0};
  g.intro='A scoop slides across the top. <b>Tap to drop it</b> onto your cone and build the tallest ice cream tower! Land it right in the middle for a <b>Perfect</b> bonus.<br><br>Drop 3 on the floor and the game ends.';
  g.hud=()=>`🍦 ${g.stack.length} scoops · ${'❤️'.repeat(3-g.misses)}${'🤍'.repeat(g.misses)} · ⭐ ${g.score}`;
  g.endTitle='What a yummy tower!';
  const nextY=n=>CR-12-n*SP;
  const topX=()=>g.stack.length?g.stack[g.stack.length-1].x:CX;
  const slideX=()=>CX+Math.sin(g.ph)*128;
  g.tap=()=>{
    if(g.fall||g.wait>0)return;
    g.fall={x:slideX(),y:SLIDE_Y-g.cam,vy:0,c:g.col,checked:false,miss:false};
    g.col=pick(FL.filter(f=>f!==g.col));sfx('swoosh');
  };
  g.update=dt=>{
    g.t+=dt;g.wait=Math.max(0,g.wait-dt);
    g.ph+=dt*Math.min(4.2,1.5+g.stack.length*.09)*DF();
    const target=Math.max(0,300-nextY(g.stack.length));
    g.cam+=(target-g.cam)*Math.min(1,dt*4);
    const f=g.fall;
    if(f){
      f.vy+=1700*dt;f.y+=f.vy*dt;
      const ly=nextY(g.stack.length);
      if(!f.checked&&f.y>=ly){
        f.checked=true;const dx=f.x-topX(),ad=Math.abs(dx);
        if(ad<R*1.15*TOL()){
          const perfect=ad<7*TOL();
          g.stack.push({x:perfect?topX():f.x,c:f.c,seed:Math.random()*1000});
          g.score+=perfect?3:1;
          const sy=ly+g.cam;
          if(perfect){addPop(g.pops,'Perfect! +3',180,sy-50,'#fde047',30);sfx('correct');burst(g.parts,topX(),sy,['#fde047','#f9a8d4','#fff'],18,180);}
          else{sfx('pop');burst(g.parts,f.x,sy,[f.c,'#fff'],8,100);}
          if(g.stack.length%10===0){addPop(g.pops,g.stack.length+' scoops! 🎉',180,200,'#a5f3fc',32);sfx('win');}
          g.fall=null;
        }else f.miss=true;
      }
      if(g.fall&&f.y+g.cam>H+40){
        g.fall=null;g.misses++;sfx('bonk');addPop(g.pops,'Splat!',f.x,H-60,'#fca5a5',30);g.wait=.4;
        if(g.misses>=3)g.over=true;
      }
    }
    stepParts(g.parts,dt,300);stepPops(g.pops,dt);
  };
  function scoop(c,x,y,col,seed){
    c.fillStyle=col;c.beginPath();c.arc(x,y,R,0,7);c.fill();
    for(let i=-2;i<=2;i++){c.beginPath();c.arc(x+i*11,y+R*.72,7,0,7);c.fill();}
    c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(x-9,y-11,8,5,-.6,0,7);c.fill();
    const sc=['#ef4444','#3b82f6','#22c55e','#facc15','#fff','#a855f7'];
    for(let i=0;i<6;i++){const a=seed+i*2.3,rr2=(Math.sin(seed*3+i)*.5+.5)*R*.6;c.save();c.translate(x+Math.cos(a)*rr2,y-4+Math.sin(a)*rr2*.6);c.rotate(a);c.fillStyle=sc[i];c.fillRect(-3.5,-1.2,7,2.4);c.restore();}
  }
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#fdf2f8');gr.addColorStop(1,'#fef3c7');
    c.fillStyle=gr;c.fillRect(0,0,W,H);
    for(let i=0;i<8;i++){c.fillStyle=i%2?'#fff':'#f472b6';c.beginPath();c.moveTo(i*45,0);c.lineTo(i*45+45,0);c.lineTo(i*45+45,26);c.arc(i*45+22.5,26,22.5,0,Math.PI);c.closePath();c.fill();}
    c.save();c.translate(0,g.cam);
    c.fillStyle='#e9d5ff';c.fillRect(0,CR+86,W,400);c.fillStyle='#c084fc';c.fillRect(0,CR+86,W,6);
    c.fillStyle='#d97706';c.beginPath();c.moveTo(CX-30,CR);c.lineTo(CX+30,CR);c.lineTo(CX,CR+84);c.closePath();c.fill();
    c.save();c.beginPath();c.moveTo(CX-30,CR);c.lineTo(CX+30,CR);c.lineTo(CX,CR+84);c.closePath();c.clip();
    c.strokeStyle='#92400e';c.lineWidth=2;for(let i=-6;i<6;i++){c.beginPath();c.moveTo(CX+i*12,CR);c.lineTo(CX+i*12+60,CR+90);c.stroke();c.beginPath();c.moveTo(CX+i*12,CR);c.lineTo(CX+i*12-60,CR+90);c.stroke();}
    c.restore();
    c.fillStyle='#b45309';rr(c,CX-33,CR-6,66,12,6);c.fill();
    g.stack.forEach((s,i)=>scoop(c,s.x,nextY(i),s.c,s.seed));
    if(g.stack.length){const top=g.stack[g.stack.length-1];emo(c,'🍒',top.x+4,nextY(g.stack.length-1)-R-6,26);}
    if(g.fall)scoop(c,g.fall.x,g.fall.y,g.fall.c,7);
    c.restore();
    if(!g.fall&&g.started){
      const x=slideX();
      c.strokeStyle='rgba(124,58,237,.25)';c.setLineDash([6,8]);c.lineWidth=2;c.beginPath();c.moveTo(x,SLIDE_Y+R);c.lineTo(x,H);c.stroke();c.setLineDash([]);
      scoop(c,x,SLIDE_Y,g.col,3);
    }
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 6: Space Star Catcher ===== */
function createSpace(){
  const RY=470;
  const g={over:false,score:0,t:0,x:180,tx:180,hearts:3,inv:0,objs:[],sT:.6,parts:[],pops:[],shake:0,
    sky:Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4}))};
  g.intro='<b>Slide your finger</b> left and right to fly the rocket. Catch ⭐ stars, 🌟 big stars and 👽 friendly aliens. Dodge the ☄️ comets!';
  g.hud=()=>`${'❤️'.repeat(Math.max(0,g.hearts))}${'🤍'.repeat(Math.max(0,3-g.hearts))} · ⭐ ${g.score}`;
  g.endTitle='Mission complete, astronaut!';
  g.move=x=>{g.tx=Math.max(26,Math.min(W-26,x));};
  g.tap=x=>g.move(x);
  g.update=dt=>{
    g.t+=dt;g.inv=Math.max(0,g.inv-dt);g.shake=Math.max(0,g.shake-dt);
    g.x+=(g.tx-g.x)*Math.min(1,dt*12);
    const boost=1+g.t/45;
    for(const s of g.sky){s.y+=s.s*50*dt*boost;if(s.y>H){s.y=-2;s.x=Math.random()*W;}}
    g.sT-=dt;
    if(g.sT<=0){
      const r=Math.random(),hz=Math.min(.5,(.22+g.t*.004)*DF());
      const k=r<hz?'☄️':r<hz+.06?'👽':r<hz+.11?'🌟':'⭐';
      g.objs.push({x:rnd(24,W-24),y:-30,vy:(rnd(150,210)+g.t*3)*DF(),k,ph:Math.random()*6});
      g.sT=Math.max(.26,.7-g.t*.006)*rnd(.7,1.2);
    }
    for(const o of g.objs){
      o.y+=o.vy*dt;
      const dx=o.x-g.x,dy=o.y-RY;
      if(!o.got&&dx*dx+dy*dy<40*40){
        if(o.k==='☄️'){if(g.inv<=0){o.got=true;g.hearts--;g.inv=1.2;g.shake=.3;sfx('bonk');addPop(g.pops,'Ouch!',g.x,RY-50,'#fca5a5',26);burst(g.parts,o.x,o.y,['#f97316','#fde047'],16,180);if(g.hearts<=0)g.over=true;}}
        else{o.got=true;const pts=o.k==='🌟'?5:o.k==='👽'?3:1;g.score+=pts;addPop(g.pops,'+'+pts,o.x,o.y-20,o.k==='👽'?'#86efac':'#fde047',pts>1?28:22);sfx(pts>1?'win':'star');burst(g.parts,o.x,o.y,['#fde047','#fff','#a5f3fc'],10,140);}
      }
    }
    g.objs=g.objs.filter(o=>o.y<H+40&&!o.got);
    stepParts(g.parts,dt,0);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    c.save();if(g.shake>0&&!S.set.calm)c.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0f172a');gr.addColorStop(1,'#4c1d95');
    c.fillStyle=gr;c.fillRect(-10,-10,W+20,H+20);
    for(const s of g.sky){c.globalAlpha=.4+s.s*.25;c.fillStyle='#fff';c.fillRect(s.x,s.y,s.s,s.s*(1+g.t/60));}
    c.globalAlpha=1;
    c.fillStyle='#f472b6';c.beginPath();c.arc(292,110,30,0,7);c.fill();
    c.strokeStyle='#fde68a';c.lineWidth=5;c.beginPath();c.ellipse(292,110,50,12,-.3,0,7);c.stroke();
    c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.arc(282,100,9,0,7);c.fill();
    for(const o of g.objs){c.save();c.translate(o.x,o.y);if(o.k==='⭐'||o.k==='🌟')c.rotate(Math.sin(g.t*3+o.ph)*.3);emo(c,o.k,0,0,o.k==='☄️'?40:o.k==='🌟'?38:30);c.restore();}
    if(!(g.inv>0&&Math.floor(g.inv*12)%2)){
      const fl=10+Math.random()*10;
      c.fillStyle='#f97316';c.beginPath();c.moveTo(g.x-9,RY+22);c.lineTo(g.x+9,RY+22);c.lineTo(g.x,RY+22+fl+8);c.closePath();c.fill();
      c.fillStyle='#fde047';c.beginPath();c.moveTo(g.x-5,RY+22);c.lineTo(g.x+5,RY+22);c.lineTo(g.x,RY+22+fl);c.closePath();c.fill();
      c.save();c.translate(g.x,RY);c.rotate(-Math.PI/4);emo(c,'🚀',0,0,50);c.restore();
    }
    drawParts(c,g.parts);drawPops(c,g.pops);c.restore();
  };
  return g;
}

/* ===== GAME 7: Garden Bonk (whack-a-gopher) ===== */
function createBonk(){
  const g={over:false,score:0,time:45,t:0,parts:[],pops:[],ham:null,
    holes:Array.from({length:9},(_,i)=>({x:70+(i%3)*110,y:230+Math.floor(i/3)*115,k:null,up:0,state:'down',timer:rnd(.3,1.6),stay:0,hit:false}))};
  g.intro='Bonk the 🐹 gophers when they pop up! Golden 🌟 stars are worth extra. <b>Don\'t bonk the 🐰 bunnies!</b><br><br>You have 45 seconds.';
  g.hud=()=>`⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='Garden saved!';
  g.tap=(x,y)=>{
    g.ham={x,y,t:.2};
    for(const h of g.holes){
      if(h.k&&!h.hit&&h.up>.35&&Math.abs(x-h.x)<48&&y>h.y-95&&y<h.y+25){
        h.hit=true;h.state='up';h.timer=.35;
        if(h.k==='🐰'){g.score=Math.max(0,g.score-2);addPop(g.pops,'Not the bunny! -2',h.x,h.y-80,'#fca5a5',20);sfx('nope');}
        else if(h.k==='🌟'){g.score+=3;addPop(g.pops,'+3',h.x,h.y-80,'#fde047',30);sfx('win');burst(g.parts,h.x,h.y-40,['#fde047','#fff'],16,180);}
        else{g.score+=1;addPop(g.pops,'Bonk! +1',h.x,h.y-80,'#fff',24);sfx('hit');burst(g.parts,h.x,h.y-40,['#fde047','#fff','#a3e635'],10,140);}
        return;
      }
    }
    sfx('swoosh');
  };
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.ham){g.ham.t-=dt;if(g.ham.t<=0)g.ham=null;}
    for(const h of g.holes){
      if(h.state==='down'){h.timer-=dt;if(h.timer<=0){const r=Math.random();h.k=r<.18?'🐰':r<.26?'🌟':'🐹';h.state='rising';h.hit=false;h.stay=Math.max(.5,1.3-g.t*.015)/DF();}}
      else if(h.state==='rising'){h.up=Math.min(1,h.up+dt*6);if(h.up>=1){h.state='up';h.timer=h.stay;}}
      else if(h.state==='up'){h.timer-=dt;if(h.timer<=0)h.state='falling';}
      else if(h.state==='falling'){h.up=Math.max(0,h.up-dt*6);if(h.up<=0){h.state='down';h.k=null;h.timer=rnd(.4,1.6)*Math.max(.5,1-g.t/90);}}
    }
    stepParts(g.parts,dt,300);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#bbf7d0');gr.addColorStop(1,'#4ade80');
    c.fillStyle=gr;c.fillRect(0,0,W,H);
    c.fillStyle='#fef3c7';for(let i=0;i<12;i++){c.fillRect(8+i*30,96,14,60);c.beginPath();c.moveTo(8+i*30,96);c.lineTo(15+i*30,86);c.lineTo(22+i*30,96);c.fill();}
    c.fillRect(0,110,W,8);c.fillRect(0,138,W,8);
    emo(c,'🌻',30,170,30);emo(c,'🌷',330,172,28);emo(c,'🥕',180,170,26);
    const tf=Math.max(0,Math.min(1,g.time/45));
    c.fillStyle='rgba(255,255,255,.7)';rr(c,20,20,W-40,12,6);c.fill();
    c.fillStyle=tf>.3?'#16a34a':'#ef4444';rr(c,20,20,(W-40)*tf,12,6);c.fill();
    label(c,'Bonk the gophers!',180,58,24,'#fff');
    for(const h of g.holes){
      c.fillStyle='#3f2a14';c.beginPath();c.ellipse(h.x,h.y,42,15,0,0,7);c.fill();
      if(h.k&&h.up>0){
        c.save();c.beginPath();c.rect(h.x-60,h.y-140,120,140);c.clip();
        const yy=h.y+34-h.up*68;
        emo(c,h.k,h.x,yy,54);
        if(h.hit&&h.k!=='🐰')emo(c,'💫',h.x,yy-36,26);
        c.restore();
      }
      c.fillStyle='#92400e';c.beginPath();c.ellipse(h.x,h.y+2,46,17,0,0,Math.PI);c.fill();
      c.fillStyle='#a16207';c.beginPath();c.ellipse(h.x,h.y+1,46,6,0,0,Math.PI);c.fill();
    }
    if(g.ham){c.save();c.translate(g.ham.x+14,g.ham.y-14);c.rotate(-.9+(.2-g.ham.t)*6);emo(c,'🔨',0,0,44);c.restore();}
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 8: Race Car Rally (racing) ===== */
function createRace(){
  const LANES=[105,180,255],CARY=440,FIN=9000,SC=.6;
  const g={over:false,score:0,t:0,lane:1,x:180,dist:0,speed:0,boost:0,slow:0,spin:0,coins:0,objs:[],sT:.9,parts:[],pops:[],shake:0,
    rivals:[{lane:0,dist:60,v:262,c:'#3b82f6',n:2},{lane:2,dist:-30,v:270,c:'#22c55e',n:5},{lane:1,dist:120,v:255,c:'#f59e0b',n:8}].map(r=>Object.assign(r,{v:r.v*DF(),x:LANES[r.lane],lt:rnd(1.5,3)}))};
  const MAX=310*DF();
  g.intro='Race to the finish line! <b>Tap the left or right side</b> of the screen to change lanes. Grab 🪙 coins, hit ⚡ boosts, and dodge 🚧 cones and oil slicks. Beat the other cars!';
  const place=()=>1+g.rivals.filter(r=>r.dist>g.dist).length;
  g.hud=()=>`🏁 ${Math.min(100,Math.floor(g.dist/FIN*100))}% · Place ${g.place||place()} of 4 · ⭐ ${g.score}`;
  g.tap=x=>{const nl=Math.max(0,Math.min(2,g.lane+(x<180?-1:1)));if(nl!==g.lane){g.lane=nl;sfx('swoosh');}};
  g.update=dt=>{
    g.t+=dt;g.boost=Math.max(0,g.boost-dt);g.slow=Math.max(0,g.slow-dt);g.spin=Math.max(0,g.spin-dt);g.shake=Math.max(0,g.shake-dt);
    const target=MAX*(g.boost>0?1.45:1)*(g.slow>0?.45:1)*(g.dist>=FIN?0:1);
    g.speed+=(target-g.speed)*Math.min(1,dt*(g.speed<target?1.6:3));
    g.x+=(LANES[g.lane]-g.x)*Math.min(1,dt*12);
    g.dist+=g.speed*dt;
    for(const r of g.rivals){
      r.dist+=r.v*dt*(.94+.12*Math.sin(g.t*.7+r.n));
      r.lt-=dt;if(r.lt<=0){r.lane=Math.max(0,Math.min(2,r.lane+(Math.random()<.5?-1:1)));r.lt=rnd(1.5,3.5);}
      r.x+=(LANES[r.lane]-r.x)*Math.min(1,dt*5);
    }
    g.sT-=dt;
    if(g.sT<=0&&g.dist<FIN-900){
      const r=Math.random(),k=r<.42?'cone':r<.56?'oil':r<.9?'coin':'boost';
      g.objs.push({k,lane:Math.floor(Math.random()*3),d:g.dist+760});
      if(k==='coin'&&Math.random()<.6)for(let i=1;i<3;i++)g.objs.push({k:'coin',lane:g.objs[g.objs.length-1].lane,d:g.dist+760+i*70});
      g.sT=Math.max(.35,.75-g.t*.006)/DF()*rnd(.7,1.3);
    }
    for(const o of g.objs){
      if(o.hit)continue;
      if(Math.abs(o.d-g.dist)<38&&Math.abs(LANES[o.lane]-g.x)<36){
        o.hit=true;const sy=CARY;
        if(o.k==='cone'){g.slow=1.1;g.shake=.3;sfx('bonk');addPop(g.pops,'Bump!',g.x,sy-60,'#fca5a5',26);burst(g.parts,g.x,sy-30,['#f97316','#fff'],12,160);}
        else if(o.k==='oil'){g.slow=.8;g.spin=.8;sfx('nope');addPop(g.pops,'Slippery!',g.x,sy-60,'#e5e7eb',24);}
        else if(o.k==='coin'){g.coins++;g.score+=2;sfx('coin');addPop(g.pops,'+2',g.x,sy-60,'#fde047',22);}
        else{g.boost=1.6;g.score+=3;sfx('win');addPop(g.pops,'BOOST! ⚡',g.x,sy-70,'#a5f3fc',30);}
      }
    }
    g.objs=g.objs.filter(o=>!o.hit&&o.d>g.dist-200);
    if(g.dist>=FIN&&!g.done){
      g.done=true;const pl=place();g.place=pl;
      g.score+=[0,50,30,20,10][pl];
      g.endTitle=['','🥇 You won the race!','🥈 Second place!','🥉 Third place!','You finished the race!'][pl];
      addPop(g.pops,['','1st PLACE!','2nd place!','3rd place!','Finished!'][pl],180,220,'#fde047',40);sfx('hr');
      burst(g.parts,180,200,['#fde047','#f472b6','#60a5fa','#34d399','#fff'],40,240);
      g.endT=1.4;
    }
    if(g.endT!=null){g.endT-=dt;if(g.endT<=0)g.over=true;}
    stepParts(g.parts,dt,200);stepPops(g.pops,dt);
  };
  function car(c,x,y,col,num,rot){
    c.save();c.translate(x,y);if(rot)c.rotate(rot);
    c.fillStyle='rgba(0,0,0,.2)';rr(c,-17,-26,38,60,10);c.fill();
    c.fillStyle='#111827';c.fillRect(-21,-22,6,14);c.fillRect(15,-22,6,14);c.fillRect(-21,12,6,14);c.fillRect(15,12,6,14);
    c.fillStyle=col;rr(c,-17,-30,34,60,10);c.fill();
    c.fillStyle='rgba(255,255,255,.85)';rr(c,-12,-20,24,12,4);c.fill();
    c.fillStyle='rgba(15,23,42,.55)';rr(c,-12,8,24,9,3);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(0,-1,7,0,7);c.fill();
    c.fillStyle='#111827';c.font='700 10px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(num,0,0);
    c.restore();
  }
  g.draw=c=>{
    c.save();if(g.shake>0&&!S.set.calm)c.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
    c.fillStyle='#4ade80';c.fillRect(-10,-10,W+20,H+20);
    const off=(g.dist*SC)%40;
    for(let y=-40+off;y<H+40;y+=40){c.fillStyle=((Math.floor((y-off)/40)+Math.floor(g.dist*SC/40))%2)?'#22c55e':'#4ade80';c.fillRect(0,y,60,40);c.fillRect(300,y,60,40);}
    for(let i=0;i<6;i++){const ty=((i*110+g.dist*SC)%(H+80))-40;emo(c,i%2?'🌳':'🌲',28,ty,30);emo(c,i%2?'🌲':'🌳',332,(ty+55)%(H+80)-20,30);}
    c.fillStyle='#4b5563';c.fillRect(60,0,240,H);
    const cOff=(g.dist*SC)%30;
    for(let y=-30+cOff;y<H+30;y+=30){const red=(Math.floor((y-cOff)/30)+Math.floor(g.dist*SC/30))%2;c.fillStyle=red?'#ef4444':'#fff';c.fillRect(56,y,8,30);c.fillRect(296,y,8,30);}
    c.fillStyle='rgba(255,255,255,.75)';
    const dOff=(g.dist*SC)%60;
    for(let y=-60+dOff;y<H+60;y+=60){c.fillRect(140,y,4,30);c.fillRect(216,y,4,30);}
    const fy=CARY-(FIN-g.dist)*SC;
    if(fy>-30&&fy<H+30){for(let i=0;i<12;i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#111':'#fff';c.fillRect(60+i*20,fy+j*10,20,10);}label(c,'FINISH',180,fy-18,20,'#fde047');}
    for(const o of g.objs){
      const y=CARY-(o.d-g.dist)*SC,x=LANES[o.lane];if(y<-40||y>H+40)continue;
      if(o.k==='oil'){c.fillStyle='#111827';c.beginPath();c.ellipse(x,y,26,12,0,0,7);c.fill();c.fillStyle='rgba(168,85,247,.5)';c.beginPath();c.ellipse(x-6,y-3,10,4,0,0,7);c.fill();}
      else emo(c,o.k==='cone'?'🚧':o.k==='coin'?'🪙':'⚡',x,y,o.k==='coin'?26:32);
    }
    for(const r of g.rivals){const y=CARY-(r.dist-g.dist)*SC;if(y>-50&&y<H+50)car(c,r.x,y,r.c,r.n,0);}
    if(g.boost>0){for(let i=0;i<3;i++){c.fillStyle=['#fde047','#f97316','#ef4444'][i];c.beginPath();c.moveTo(g.x-8+i*8,CARY+30);c.lineTo(g.x-4+i*8,CARY+44+Math.random()*16);c.lineTo(g.x+i*8,CARY+30);c.fill();}}
    car(c,g.x,CARY,'#dc2626',7,g.spin>0?Math.sin(g.spin*20)*.5:(LANES[g.lane]-g.x)*-.01);
    // progress bar
    c.fillStyle='rgba(255,255,255,.85)';rr(c,14,12,W-28,22,11);c.fill();
    const bx=t=>26+(W-52)*Math.max(0,Math.min(1,t/FIN));
    for(const r of g.rivals){c.fillStyle=r.c;c.beginPath();c.arc(bx(r.dist),23,6,0,7);c.fill();}
    c.fillStyle='#dc2626';c.beginPath();c.arc(bx(g.dist),23,8,0,7);c.fill();
    emo(c,'🏁',W-26,23,16);
    drawParts(c,g.parts);drawPops(c,g.pops);
    c.restore();
  };
  return g;
}

/* ===== GAME 9: Penalty Kick Shootout (soccer) ===== */
function createSoccer(){
  const GL=62,GR=298,GT=150,GB=268,BALL0={x:180,y:470};
  const g={over:false,score:0,t:0,kick:0,total:10,goals:0,state:'aim',timer:0,aimT:Math.random()*6,aimX:180,kx:180,ktx:180,dive:0,ball:null,parts:[],pops:[],crowd:[]};
  for(let i=0;i<80;i++)g.crowd.push({x:Math.random()*W,y:40+Math.random()*60,c:['#f87171','#60a5fa','#fbbf24','#34d399','#a78bfa','#fff'][i%6],ph:Math.random()*6});
  g.intro='The 🎯 target slides across the goal. <b>Tap to shoot</b> when it\'s away from the goalie! 10 kicks. Goal = 3 points, top corner = 1 bonus point.';
  g.hud=()=>`⚽ Kick ${Math.min(g.kick+(g.state==='aim'?1:0),g.total)}/${g.total} · 🥅 ${plural(g.goals,'goal')} · ⭐ ${g.score}`;
  g.endTitle='Great shooting!';
  const reach=()=>30/TOL();
  // The result is decided when the ball is kicked, then the dive is drawn to match it:
  // a save ends with the ball in the goalie's glove, a goal ends with the glove clearly short.
  g.tap=()=>{
    if(g.state!=='aim')return;
    g.state='shot';g.kick++;sfx('hit');
    const dur=.5/DF(),react=.18/DF(),tx=g.aimX,ty=rnd(GT+22,GB-26);
    const dir=Math.sign(tx-g.kx)||1,move=Math.min(Math.abs(tx-g.kx),165*DF()*(dur-react));
    const kEnd=g.kx+dir*move,saved=Math.abs(kEnd-tx)<reach();
    const sx=kEnd+dir*12,sy=GB-58;                      // diving shoulder
    let gx=tx,gy=ty;                                     // glove target
    if(!saved){const dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1,armLen=Math.min(len-26,30);gx=sx+dx/len*armLen;gy=sy+dy/len*armLen;}
    g.ball={t:0,dur,tx,ty,dir,saved};g.react=react;g.k0=g.kx;g.kEnd=kEnd;g.glove={x:gx,y:gy};
  };
  g.update=dt=>{
    g.t+=dt;stepParts(g.parts,dt,250);stepPops(g.pops,dt);
    if(g.state==='aim'){
      g.aimT+=dt*(1.6+g.kick*.08)*DF();
      g.aimX=180+Math.sin(g.aimT)*112;
      g.ktx=180+Math.sin(g.t*1.2)*55;
      g.kx+=(g.ktx-g.kx)*Math.min(1,dt*4);g.dive=Math.max(0,g.dive-dt*3);
    }else if(g.state==='shot'){
      const b=g.ball;b.t+=dt;
      if(b.t>g.react){const q=Math.min(1,(b.t-g.react)/(b.dur-g.react));g.kx=g.k0+(g.kEnd-g.k0)*q;g.dive=q;}
      if(b.t>=b.dur){
        const saved=b.saved;g.kx=g.kEnd;g.dive=1;
        if(saved){addPop(g.pops,'SAVED!',180,220,'#fca5a5',38);sfx('bonk');b.bx=b.tx;b.by=b.ty;b.vx=-b.dir*rnd(60,110);b.vy=-60;}
        else{
          g.goals++;let pts=3;const corner=Math.abs(b.tx-180)>92;if(corner)pts++;
          g.score+=pts;addPop(g.pops,corner?'TOP CORNER! +4':'GOAL! +3',180,220,'#fde047',corner?34:40);sfx('hr');
          burst(g.parts,b.tx,b.ty,['#fde047','#fff','#60a5fa','#f472b6'],30,220);g.party=1.2;
        }
        g.state='result';g.timer=1.3;g.saved=saved;
      }
    }else if(g.state==='result'){
      g.timer-=dt;g.party=Math.max(0,(g.party||0)-dt);
      const b=g.ball;if(b&&b.saved&&g.timer<1.1){b.bx+=b.vx*dt;b.by+=b.vy*dt;b.vy+=420*dt;}
      if(g.timer<=0){if(g.kick>=g.total){g.over=true;return;}g.state='aim';g.ball=null;g.dive=0;g.glove=null;}
    }
  };
  function keeper(c){
    const x=g.kx,y=GB-6,d=g.dive,b=g.ball,dir=b?b.dir:0;
    c.save();c.translate(x,y);c.rotate(dir*d*.18);         // small lean only
    c.fillStyle='#1f2937';c.fillRect(-9,-22,7,22);c.fillRect(2,-22,7,22);
    c.fillStyle='#facc15';rr(c,-14,-58,28,38,8);c.fill();
    c.fillStyle='#f5c9a0';c.beginPath();c.arc(0,-70,10,0,7);c.fill();
    c.fillStyle='#111827';c.beginPath();c.arc(0,-74,10,Math.PI,0);c.fill();
    c.restore();
    // Arms in screen space, so the glove is drawn exactly where the save is decided.
    const arm=(sx,sy,gx,gy)=>{c.strokeStyle='#facc15';c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(sx,sy);c.lineTo(gx,gy);c.stroke();
      c.fillStyle='#22c55e';c.beginPath();c.arc(gx,gy,7,0,7);c.fill();c.strokeStyle='#14532d';c.lineWidth=1.5;c.stroke();};
    const restL={x:x-30,y:y-64},restR={x:x+30,y:y-64};
    if(b&&g.glove&&dir){
      const sx=x+dir*12,sy=y-52,q=d*d*(3-2*d),rest=dir>0?restR:restL;
      arm(x-dir*12,sy,x-dir*28,y-60);                       // other arm stays up
      arm(sx,sy,rest.x+(g.glove.x-rest.x)*q,rest.y+(g.glove.y-rest.y)*q);
    }else{arm(x-12,y-52,restL.x,restL.y);arm(x+12,y-52,restR.x,restR.y);}
  }
  g.draw=c=>{
    c.fillStyle='#1e3a8a';c.fillRect(0,0,W,110);
    const party=(g.party||0)>0;
    for(const p of g.crowd){const bob=Math.abs(Math.sin(g.t*(party?14:3)+p.ph))*(party?6:1.5);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y-bob,4.2,0,7);c.fill();}
    c.fillStyle='#e2e8f0';c.fillRect(0,104,W,10);c.fillStyle='#ef4444';c.font='700 9px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('★ SPELLING STARS CUP ★',180,109);
    for(let i=0;i<11;i++){c.fillStyle=i%2?'#4ade80':'#22c55e';c.fillRect(0,114+i*40,W,40);}
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=3;c.strokeRect(30,GB,300,120);c.beginPath();c.moveTo(0,GB);c.lineTo(W,GB);c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(180,BALL0.y,4,0,7);c.fill();
    c.fillStyle='rgba(255,255,255,.18)';c.fillRect(GL,GT,GR-GL,GB-GT);
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;
    for(let x=GL;x<=GR;x+=14){c.beginPath();c.moveTo(x,GT);c.lineTo(x,GB);c.stroke();}
    for(let y=GT;y<=GB;y+=14){c.beginPath();c.moveTo(GL,y);c.lineTo(GR,y);c.stroke();}
    c.fillStyle='#fff';c.fillRect(GL-6,GT-6,GR-GL+12,7);c.fillRect(GL-6,GT-6,7,GB-GT+6);c.fillRect(GR-1,GT-6,7,GB-GT+6);
    const b0=g.ball,p0=b0?Math.min(1,b0.t/b0.dur):0;
    const ballPos=()=>{const e=1-Math.pow(1-p0,2);return {x:BALL0.x+(b0.tx-BALL0.x)*e,y:BALL0.y+(b0.ty-BALL0.y)*e-Math.sin(p0*Math.PI)*30,s:34-16*p0};};
    // A goal passes the keeper into the net (drawn behind him); a save ends in his glove (drawn on top).
    if(b0&&!b0.saved&&p0>.6){const q=ballPos();emo(c,'⚽',q.x,q.y,q.s);}
    keeper(c);
    if(g.state==='aim'){
      const ay=(GT+GB)/2;c.strokeStyle='#ef4444';c.lineWidth=4;c.beginPath();c.arc(g.aimX,ay,16,0,7);c.stroke();c.beginPath();c.arc(g.aimX,ay,6,0,7);c.stroke();
      c.beginPath();c.moveTo(g.aimX-24,ay);c.lineTo(g.aimX+24,ay);c.moveTo(g.aimX,ay-24);c.lineTo(g.aimX,ay+24);c.lineWidth=2;c.stroke();
      emo(c,'⚽',BALL0.x,BALL0.y,34);
      c.fillStyle='#f5c9a0';
    }
    if(b0){
      if(b0.saved&&g.state==='result')emo(c,'⚽',b0.bx,b0.by,18);
      else if(b0.saved||p0<=.6){const q=ballPos();emo(c,'⚽',q.x,q.y,q.s);}
    }
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 10: Hoop Shot (basketball) ===== */
function createHoops(){
  const HY=150,BALLX=120,BALLY=480,RIMX=180,ARC=150;
  // Where the ball is at time p (0..1) of the shot: a real arc that drops into the rim at RIMX.
  const shotPt=p=>({x:BALLX+(RIMX-BALLX)*p,y:BALLY+(HY-BALLY)*p-Math.sin(p*Math.PI)*ARC});
  const g={over:false,score:0,t:0,time:45,hx:180,hp:Math.random()*6,ball:null,made:0,streak:0,parts:[],pops:[],shots:0};
  g.intro='The hoop slides back and forth. Follow the dashed aiming arc: <b>tap to shoot</b> when it turns green, so the hoop is there when the ball arrives! Swish = 3 points. Make 3 in a row to catch fire 🔥 for double points. 45 seconds!';
  g.hud=()=>`🏀 ${plural(g.made,'basket')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}${g.streak>=3?' 🔥':''}`;
  g.endTitle='Buzzer! Great game!';
  const hoopSpeed=()=>(1.3+Math.min(1.6,g.made*.08))*DF();
  g.tap=()=>{if(g.ball)return;g.ball={t:0,dur:.62,phase:'up'};g.shots++;sfx('swoosh');};
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0&&!g.ball){g.time=0;g.over=true;return;}if(g.time<0)g.time=0;
    g.hp+=dt*hoopSpeed();g.hx=180+Math.sin(g.hp)*115;
    const b=g.ball;
    if(b){
      b.t+=dt;
      if(b.phase==='up'&&b.t>=b.dur){
        const d=Math.abs(g.hx-RIMX),T=TOL();
        if(d<12*T){b.phase='in';b.swish=true;}
        else if(d<28*T){b.phase='in';b.swish=false;}
        else{b.phase='miss';b.vx=(RIMX>g.hx?1:-1)*rnd(120,200);b.vy=-120;b.x=RIMX;b.y=HY;}
        b.t2=0;
        if(b.phase==='in'){
          g.made++;g.streak++;const fire=g.streak>=3;let pts=(b.swish?3:2)*(fire?2:1);g.score+=pts;
          addPop(g.pops,(b.swish?'SWISH! ':'Basket! ')+'+'+pts,180,HY+70,b.swish?'#fde047':'#86efac',b.swish?34:30);
          if(g.streak===3)addPop(g.pops,'ON FIRE! 🔥',180,HY+115,'#fb923c',30);
          sfx(b.swish?'hr':'hit');burst(g.parts,g.hx,HY+20,['#fb923c','#fde047','#fff'],18,170);
        }else{g.streak=0;addPop(g.pops,'Clank!',g.hx,HY-10,'#e5e7eb',24);sfx('bonk');}
      }
      if(b.phase==='in'){b.t2+=dt;if(b.t2>.45)g.ball=null;}
      else if(b.phase==='miss'){b.t2+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=900*dt;if(b.y>H+40)g.ball=null;}
    }
    stepParts(g.parts,dt,250);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,300);gr.addColorStop(0,'#312e81');gr.addColorStop(1,'#4c1d95');
    c.fillStyle=gr;c.fillRect(0,0,W,300);
    for(let i=0;i<5;i++){c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.moveTo(40+i*70,0);c.lineTo(20+i*70,300);c.lineTo(60+i*70,300);c.fill();}
    c.fillStyle='#111827';rr(c,110,16,140,34,8);c.fill();
    c.fillStyle='#ef4444';c.font='700 22px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText(String(g.score).padStart(3,'0'),150,33);c.fillStyle='#fde047';c.fillText(':'+String(Math.ceil(g.time)).padStart(2,'0'),212,33);
    for(let i=0;i<13;i++){c.fillStyle=i%2?'#d97706':'#f59e0b';c.fillRect(0,300+i*20,W,20);}
    c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=3;c.beginPath();c.ellipse(180,380,120,40,0,Math.PI,0);c.stroke();c.beginPath();c.moveTo(0,300);c.lineTo(W,300);c.stroke();
    const x=g.hx;
    c.fillStyle='#6b7280';c.fillRect(x-3,HY-60,6,20);
    c.fillStyle='#fff';rr(c,x-44,HY-70,88,58,4);c.fill();c.strokeStyle='#ef4444';c.lineWidth=3;c.strokeRect(x-16,HY-46,32,26);
    c.strokeStyle='#e5e7eb';c.lineWidth=1.5;
    for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(x+i*7,HY+4);c.lineTo(x+i*4.5,HY+38);c.stroke();}
    c.beginPath();c.moveTo(x-20,HY+16);c.lineTo(x+20,HY+16);c.moveTo(x-17,HY+28);c.lineTo(x+17,HY+28);c.stroke();
    const b=g.ball;
    const drawBall=(bx,by,s)=>emo(c,'🏀',bx,by,s);
    if(b&&b.phase==='in'){const p=Math.min(1,b.t2/.45);drawBall(x,HY+p*50,30);}
    c.strokeStyle='#f97316';c.lineWidth=4;c.beginPath();c.ellipse(x,HY+4,24,7,0,0,7);c.stroke();
    if(b&&b.phase==='up'){const p=Math.min(1,b.t/b.dur),q=shotPt(p);drawBall(q.x,q.y,46-16*p);}
    if(b&&b.phase==='miss')drawBall(b.x,b.y,30);
    if(!b){
      // Aiming guide: the ball's path as a see-through dashed arc. It turns green when the
      // hoop will be under the rim target by the time the ball gets there.
      const future=180+Math.sin(g.hp+.62*hoopSpeed())*115,d=Math.abs(future-RIMX),T=TOL();
      const col=d<12*T?'rgba(74,222,128,.9)':d<28*T?'rgba(253,224,71,.85)':'rgba(255,255,255,.55)';
      c.save();c.setLineDash([9,9]);c.lineDashOffset=-g.t*30;c.lineWidth=4;c.lineCap='round';c.strokeStyle=col;
      c.beginPath();for(let i=0;i<=40;i++){const q=shotPt(.06+i/40*.94);if(i)c.lineTo(q.x,q.y);else c.moveTo(q.x,q.y);}c.stroke();
      c.setLineDash([5,6]);c.lineWidth=2.5;c.beginPath();c.ellipse(RIMX,HY+4,24,7,0,0,7);c.stroke();
      c.restore();
      drawBall(BALLX,BALLY,46);c.fillStyle='rgba(255,255,255,.6)';c.font='600 14px Fredoka, sans-serif';c.textAlign='center';
      c.fillText(d<12*T?'shoot now!':'tap to shoot',BALLX,BALLY+38);
    }
    if(g.streak>=3){c.globalAlpha=.25+.15*Math.sin(g.t*10);c.fillStyle='#f97316';c.fillRect(0,0,W,6);c.fillRect(0,H-6,W,6);c.globalAlpha=1;}
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== shared helpers for spelling games ===== */
function pickWord(pool,prev){let w,n=0;do{w=pick(pool);n++;}while(pool.length>1&&w===prev&&n<12);return w;}
function slotsPanel(c,y,word,show,colorFor){
  const L=word.length,bw=Math.min(36,(W-40)/L),x0=(W-bw*L)/2+bw/2;
  c.font=`700 ${Math.floor(bw*.92)}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<L;i++){
    const x=x0+i*bw;
    c.fillStyle='rgba(255,255,255,.55)';rr(c,x-bw/2+2,y+18,bw-4,5,2);c.fill();
    const ch=show(i);if(ch){c.fillStyle=colorFor?colorFor(i):'#fff';c.fillText(ch.toUpperCase(),x,y);}
  }
}
function roundBtn(c,x,y,r,em,on){c.fillStyle=on?'rgba(255,255,255,.95)':'rgba(255,255,255,.75)';c.beginPath();c.arc(x,y,r,0,7);c.fill();emo(c,em,x,y+1,r*1.05);}
const hitCircle=(x,y,cx,cy,r)=>(x-cx)*(x-cx)+(y-cy)*(y-cy)<(r+6)*(r+6);

/* ===== GAME 11: Letter Catcher ===== */
function createCatcher(){
  const pool=wordPool(),BY=478,AB='abcdefghijklmnopqrstuvwxyz';
  const T={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const COLS=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
  const g={over:false,score:0,t:0,time:T,tmax:T,word:'',idx:0,bx:180,tx:180,hearts:3,inv:0,items:[],sT:0,parts:[],pops:[],done:0,wait:0};
  g.intro=`Slide your finger to move the 🧺 basket. Catch the letters <b>in order</b> to spell the word at the top. Catching a wrong letter costs 2 seconds, so dodge those!<br><br>You have ${T} seconds!`;
  g.hud=()=>`🧺 ${plural(g.done,'word')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='Great catching!';
  const need=()=>g.word[g.idx];
  function next(){g.word=pickWord(pool,g.word);g.idx=0;g.items=g.items.filter(i=>i.y>BY-120);speak(g.word);}
  function spawn(l){g.items.push({x:rnd(30,W-30),y:118,vy:rnd(85,120)*DF(),l,c:pick(COLS),rot:rnd(-.3,.3)});}
  g.begin=()=>next();
  g.move=x=>{g.tx=Math.max(40,Math.min(W-40,x));};
  g.tap=(x,y)=>{if(hitCircle(x,y,W-34,62,18)){speak(g.word);return;}g.move(x);};
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    g.inv=Math.max(0,g.inv-dt);
    g.bx+=(g.tx-g.bx)*Math.min(1,dt*14);
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)next();}
    g.sT-=dt;
    if(g.sT<=0){const n=need();spawn(n&&g.wait<=0&&Math.random()<.5?n:pick(AB));g.sT=(.75+Math.random()*.35)/DF();}
    const n=need();if(n&&g.wait<=0&&!g.items.some(i=>i.l===n&&i.y<BY-60))spawn(n);
    for(const it of g.items){
      it.y+=it.vy*dt;
      if(!it.done&&it.y>=BY-26&&it.y<=BY+10&&Math.abs(it.x-g.bx)<44){
        it.done=true;
        if(g.wait<=0&&it.l===need()){
          g.idx++;g.score+=1;sfx('pop');burst(g.parts,it.x,it.y,[it.c,'#fff'],12,160);
          if(g.idx>=g.word.length){g.done++;g.score+=g.word.length;g.time=Math.min(g.tmax+30,g.time+3);addPop(g.pops,`${g.word.toUpperCase()}! +${g.word.length}`,180,220,'#fde047',34);sfx('win');g.wait=1;}
        }else if(g.wait<=0&&g.inv<=0){
          g.time=Math.max(0,g.time-2);g.inv=.6;sfx('nope');addPop(g.pops,'−2s · Need '+(need()||'').toUpperCase(),g.bx,BY-70,'#fca5a5',22);
        }
      }
    }
    g.items=g.items.filter(i=>!i.done&&i.y<H+30);
    stepParts(g.parts,dt,300);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#bae6fd');gr.addColorStop(.75,'#e0f2fe');gr.addColorStop(.75,'#86efac');gr.addColorStop(1,'#4ade80');

/* ===== GAME 12: Moon Rocket (gentle hangman) ===== */
function createMoonRocket(){
  const pool=wordPool(),FUEL={easy:8,normal:6,hard:5}[S.set.diff]||6,ROUNDS=5;
  const ROWS=['abcdefg','hijklmn','opqrstu','vwxyz'],KS=44,KG=6,KY=330;
  const keyPos=[];ROWS.forEach((r,ri)=>{const w=r.length*KS+(r.length-1)*KG,x0=(W-w)/2;[...r].forEach((ch,ci)=>keyPos.push({ch,x:x0+ci*(KS+KG),y:KY+ri*(KS+KG)}));});
  const g={over:false,score:0,t:0,round:0,word:'',got:new Set(),tried:new Set(),fuel:FUEL,state:'play',timer:0,ry:0,parts:[],pops:[],launched:0,hint:'',
    stars:Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*320,s:Math.random()*1.8+.4}))};

  const solved=()=>[...g.word].every(ch=>g.got.has(ch));
  function next(){g.round++;g.word=pickWord(pool,g.word);g.got=new Set();g.tried=new Set();g.fuel=FUEL;g.state='play';g.ry=0;g.hint='';speak(g.word);}

    if(g.word.includes(L)){
      g.got.add(L);sfx('pop');burst(g.parts,k.x+KS/2,k.y+KS/2,['#86efac','#fff'],8,120);
      if(solved()){g.state='launch';g.timer=2.4;const pts=10+g.fuel*2+g.word.length;g.score+=pts;g.launched++;addPop(g.pops,`BLAST OFF! +${pts}`,180,200,'#fde047',34);sfx('hr');}
    }else{

  g.update=dt=>{

    if(g.state!=='play'){g.timer-=dt;if(g.timer<=0){if(g.round>=ROUNDS){g.over=true;return;}next();}}
  };
  function wrap(c,text,x,y,maxW,lh){const words=text.split(' ');let line='',yy=y;for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}if(line)c.fillText(line,x,yy);}
  g.draw=c=>{

    emo(c,'🌕',W-48,40+Math.min(0,g.ry*.05),40);

      const fail=g.state==='fail';
      slotsPanel(c,92,g.word,i=>(g.got.has(g.word[i])||fail)?g.word[i]:'',i=>fail&&!g.got.has(g.word[i])?'#fca5a5':'#fff');
    }
