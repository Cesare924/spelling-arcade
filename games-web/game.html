    c.fillStyle='#64748b';rr(c,140,290,80,14,4);c.fill();
    if(g.state==='launch'){c.fillStyle='#f97316';c.beginPath();c.moveTo(170,270+g.ry);c.lineTo(190,270+g.ry);c.lineTo(180,300+g.ry+Math.random()*14);c.closePath();c.fill();}
    c.save();c.translate(180,245+g.ry);c.rotate(-Math.PI/4);emo(c,'🚀',0,0,56);c.restore();
    for(let i=0;i<FUEL;i++){const on=i<g.fuel;c.fillStyle=on?(g.fuel<=2?'#f97316':'#22c55e'):'rgba(255,255,255,.15)';rr(c,250+i*(80/FUEL),286,80/FUEL-3,18,3);c.fill();}
    c.fillStyle='#e0e7ff';c.font='600 11px Fredoka, sans-serif';c.textAlign='center';c.fillText('⛽ FUEL',290,276);
    if(g.hint){c.fillStyle='rgba(255,255,255,.92)';rr(c,14,182,W-28,58,12);c.fill();c.fillStyle='#1e1b4b';c.font='600 14px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';
      const blank=g.hint.replace(new RegExp('(^|[^A-Za-z])('+escRe(g.word)+')(?![A-Za-z])','gi'),(m,p)=>p+'_'.repeat(g.word.length));wrap(c,'💬 '+blank,180,201,W-48,18);}
    for(const k of keyPos){
      const t=g.tried.has(k.ch),good=t&&g.word.includes(k.ch);
      c.fillStyle=good?'#16a34a':t?'#475569':'#ede9fe';rr(c,k.x,k.y,KS,KS,10);c.fill();
      c.fillStyle=good||t?'#fff':'#3b0764';c.font='700 22px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(k.ch.toUpperCase(),k.x+KS/2,k.y+KS/2+1);
    }
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 13: Scramble Rush ===== */
function createScramble(){
  let pool=wordPool().filter(w=>w.length>=3);if(!pool.length)pool=wordPool();
  const T={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const g={over:false,score:0,t:0,time:T,tmax:T,word:'',tiles:[],built:'',done:0,wait:0,parts:[],pops:[],
    bg:Array.from({length:14},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(10,30),v:rnd(8,20)}))};
  g.intro=`Unscramble the mixed-up letters! Tap them <b>in the right order</b> to spell the word. Each word you finish adds time.<br><br>Tap 🔊 to hear the word, or ⏭ to skip one (costs 3 seconds). You have ${T} seconds!`;
  g.hud=()=>`🔀 ${plural(g.done,'word')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='Super unscrambling!';
  function layout(){
    const n=g.tiles.length,perRow=Math.min(n,6),rows=Math.ceil(n/6),sz=Math.min(54,(W-30)/perRow-8);
    g.tiles.forEach((t,i)=>{const r=Math.floor(i/6),inRow=r<rows-1?6:n-6*(rows-1),idx=i-6*r,rowW=inRow*sz+(inRow-1)*8;t.sz=sz;t.x=(W-rowW)/2+idx*(sz+8);t.y=330+r*(sz+12);});
  }
  function next(){
    g.word=pickWord(pool,g.word);g.built='';
    let letters=[...g.word];for(let k=0;k<12;k++){letters=shuffle(letters);if(letters.join('')!==g.word||new Set(g.word).size<2)break;}
    g.tiles=letters.map(c=>({c,used:false,wig:0}));layout();speak(g.word);
  }
  g.begin=()=>next();
  g.tap=(x,y)=>{
    if(g.wait>0)return;
    if(hitCircle(x,y,60,250,22)){speak(g.word);return;}
    if(hitCircle(x,y,W-60,250,22)){g.time=Math.max(0,g.time-3);addPop(g.pops,`Skipped: ${g.word.toUpperCase()}`,180,200,'#e5e7eb',22);sfx('swoosh');next();return;}
    const t=g.tiles.find(t=>!t.used&&x>=t.x&&x<=t.x+t.sz&&y>=t.y&&y<=t.y+t.sz);if(!t)return;
    if(t.c===g.word[g.built.length]){
      t.used=true;g.built+=t.c;sfx('pop');burst(g.parts,t.x+t.sz/2,t.y+t.sz/2,['#fde047','#fff'],8,120);
      if(g.built.length===g.word.length){g.done++;const pts=g.word.length*2;g.score+=pts;g.time=Math.min(g.tmax+30,g.time+3);addPop(g.pops,`${g.word.toUpperCase()}! +${pts}`,180,190,'#fde047',34);sfx('win');g.wait=.9;}
    }else{t.wig=.4;sfx('nope');}
  };
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)next();}
    for(const t of g.tiles)t.wig=Math.max(0,t.wig-dt);
    for(const b of g.bg){b.y-=b.v*dt;if(b.y<-40){b.y=H+40;b.x=Math.random()*W;}}
    stepParts(g.parts,dt,250);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7c3aed');gr.addColorStop(1,'#db2777');c.fillStyle=gr;c.fillRect(0,0,W,H);
    for(const b of g.bg){c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();}
    const tf=Math.max(0,Math.min(1,g.time/g.tmax));
    c.fillStyle='rgba(255,255,255,.3)';rr(c,20,16,W-40,12,6);c.fill();c.fillStyle=tf>.3?'#86efac':'#fca5a5';rr(c,20,16,(W-40)*tf,12,6);c.fill();
    label(c,'Unscramble!',180,62,30,'#fde047');
    if(g.word){
      const L=g.word.length,bw=Math.min(40,(W-40)/L),x0=(W-bw*L)/2;
      for(let i=0;i<L;i++){const x=x0+i*bw;c.fillStyle=i<g.built.length?'#fff':'rgba(255,255,255,.25)';rr(c,x+3,110,bw-6,bw+6,8);c.fill();
        if(i<g.built.length){c.fillStyle='#6d28d9';c.font=`700 ${Math.floor(bw*.75)}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(g.built[i].toUpperCase(),x+bw/2,110+(bw+6)/2+1);}}
    }
    roundBtn(c,60,250,22,'🔊');roundBtn(c,W-60,250,22,'⏭️');
    c.fillStyle='rgba(255,255,255,.85)';c.font='600 12px Fredoka, sans-serif';c.textAlign='center';c.fillText('hear it',60,284);c.fillText('skip (−3s)',W-60,284);
    for(const t of g.tiles){
      if(t.used)continue;const wx=t.wig>0?Math.sin(t.wig*40)*4:0;
      c.fillStyle='#fde68a';rr(c,t.x+wx,t.y,t.sz,t.sz,12);c.fill();c.fillStyle='#f59e0b';rr(c,t.x+wx,t.y+t.sz-5,t.sz,5,3);c.fill();
      c.fillStyle='#78350f';c.font=`700 ${Math.floor(t.sz*.55)}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(t.c.toUpperCase(),t.x+wx+t.sz/2,t.y+t.sz/2);
    }
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 14: Spelling Snake ===== */
function createSnake(){
  const pool=wordPool(),AB='abcdefghijklmnopqrstuvwxyz',CS=30,COLS=12,ROWS=11,OY=122,PADY=468,PADH=62;
  const PADS=[{d:{x:-1,y:0},em:'⬅️'},{d:{x:0,y:-1},em:'⬆️'},{d:{x:0,y:1},em:'⬇️'},{d:{x:1,y:0},em:'➡️'}].map((p,i)=>Object.assign(p,{x:10+i*87,w:80}));
  const T={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const g={over:false,score:0,t:0,time:T,tmax:T,word:'',idx:0,snake:[{x:5,y:5},{x:4,y:5},{x:3,y:5}],dir:{x:1,y:0},q:[],stepT:0,sw:null,flash:-1,flashT:0,letters:[],grow:0,done:0,wait:0,parts:[],pops:[]};
  g.intro=`Steer the 🐍 snake with the <b>arrow buttons</b> (or swipe on the board). Eat the letters <b>in order</b> to spell the word at the top!<br><br>Wrong letters cost 2 seconds. You can slide through the walls. ${T} seconds!`;
  g.hud=()=>`🐍 ${plural(g.done,'word')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='Sssuper spelling!';
  const need=()=>g.word[g.idx];
  const cellX=x=>x*CS+CS/2,cellY=y=>OY+y*CS+CS/2;
  function free(){const occ=new Set(g.snake.map(s=>s.x+','+s.y).concat(g.letters.map(l=>l.x+','+l.y)));const h=g.snake[0];
    for(let k=0;k<200;k++){const x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);if(!occ.has(x+','+y)&&Math.abs(x-h.x)+Math.abs(y-h.y)>2)return {x,y};}return {x:0,y:0};}
  function place(){g.letters=[];const n=need();if(!n)return;g.letters.push(Object.assign(free(),{l:n}));
    const used=new Set([n]);while(g.letters.length<4){const d=pick(AB);if(used.has(d))continue;used.add(d);g.letters.push(Object.assign(free(),{l:d}));}}
  function next(){g.word=pickWord(pool,g.word);g.idx=0;place();speak(g.word);}
  g.begin=()=>next();
  function turn(nd){
    const last=g.q.length?g.q[g.q.length-1]:g.dir;
    if((nd.x===last.x&&nd.y===last.y)||(nd.x===-last.x&&nd.y===-last.y))return;
    if(g.q.length<2)g.q.push(nd);
  }
  g.tap=(x,y)=>{
    if(hitCircle(x,y,W-34,62,18)){speak(g.word);return;}
    const p=PADS.findIndex(p=>x>=p.x&&x<=p.x+p.w&&y>=PADY&&y<=PADY+PADH);
    if(p>=0){turn(PADS[p].d);g.flash=p;g.flashT=.15;sfx('flip');return;}
    if(y>=OY&&y<OY+ROWS*CS)g.sw={x,y};
  };
  g.move=(x,y)=>{
    if(!g.sw)return;const dx=x-g.sw.x,dy=y-g.sw.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
    turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});g.sw={x,y};
  };
  g.release=()=>{g.sw=null;};
  function step(){
    if(g.q.length)g.dir=g.q.shift();const h=g.snake[0];
    const nh={x:(h.x+g.dir.x+COLS)%COLS,y:(h.y+g.dir.y+ROWS)%ROWS};
    const hit=g.snake.findIndex((s,i)=>i<g.snake.length-1&&s.x===nh.x&&s.y===nh.y);
    if(hit>0){g.snake=g.snake.slice(0,Math.max(3,hit));g.time=Math.max(0,g.time-1);sfx('bonk');addPop(g.pops,'Oops! −1s',cellX(nh.x),cellY(nh.y)-20,'#fca5a5',22);}
    g.snake.unshift(nh);
    const li=g.letters.findIndex(l=>l.x===nh.x&&l.y===nh.y);
    if(li>=0){
      const L=g.letters[li];
      if(g.wait<=0&&L.l===need()){
        g.grow+=1;g.idx++;g.score+=1;sfx('pop');burst(g.parts,cellX(nh.x),cellY(nh.y),['#fde047','#86efac','#fff'],12,140);
        if(g.idx>=g.word.length){g.done++;g.score+=g.word.length;g.time=Math.min(g.tmax+30,g.time+3);addPop(g.pops,`${g.word.toUpperCase()}! +${g.word.length}`,180,240,'#fde047',34);sfx('win');g.letters=[];g.wait=.9;}
        else place();
      }else{g.letters.splice(li,1);g.time=Math.max(0,g.time-2);sfx('nope');addPop(g.pops,'−2s · Need '+(need()||'').toUpperCase(),cellX(nh.x),cellY(nh.y)-20,'#fca5a5',20);
        const used=new Set(g.letters.map(l=>l.l));let d;do{d=pick(AB);}while(used.has(d)||d===need());g.letters.push(Object.assign(free(),{l:d}));}
    }
    if(g.grow>0)g.grow--;else g.snake.pop();
  }
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)next();}
    g.flashT=Math.max(0,g.flashT-dt);
    g.stepT+=dt;const iv=Math.max(.24,.38-g.done*.006)/DF();
    while(g.stepT>=iv){g.stepT-=iv;step();}
    stepParts(g.parts,dt,200);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    c.fillStyle='#14532d';c.fillRect(0,0,W,H);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){c.fillStyle=(x+y)%2?'#4ade80':'#22c55e';c.fillRect(x*CS,OY+y*CS,CS,CS);}
    PADS.forEach((p,i)=>{c.fillStyle=g.flashT>0&&g.flash===i?'#fde047':'rgba(255,255,255,.9)';rr(c,p.x,PADY,p.w,PADH,16);c.fill();emo(c,p.em,p.x+p.w/2,PADY+PADH/2+1,34);});
    c.fillStyle='#6d28d9';rr(c,10,10,W-20,84,18);c.fill();
    c.fillStyle='#ddd6fe';c.font='600 13px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(g.started?'EAT THE LETTERS IN ORDER':'GET READY',170,26);
    if(g.word){slotsPanel(c,58,g.word,i=>g.word[i],i=>i<g.idx?'#fff':i===g.idx?'#fde047':'rgba(255,255,255,.3)');roundBtn(c,W-34,62,18,'🔊');}
    const tf=Math.max(0,Math.min(1,g.time/g.tmax));c.fillStyle='rgba(255,255,255,.6)';rr(c,20,102,W-40,10,5);c.fill();c.fillStyle=tf>.3?'#fde047':'#ef4444';rr(c,20,102,(W-40)*tf,10,5);c.fill();
    for(const L of g.letters){const x=cellX(L.x),y=cellY(L.y);c.fillStyle='#fff';c.beginPath();c.arc(x,y,13,0,7);c.fill();c.strokeStyle='#7c3aed';c.lineWidth=2.5;c.stroke();c.fillStyle='#4c1d95';c.font='700 18px Fredoka, sans-serif';c.fillText(L.l.toUpperCase(),x,y+1);}
    g.snake.forEach((s,i)=>{const x=cellX(s.x),y=cellY(s.y);c.fillStyle=i===0?'#7c3aed':i%2?'#a78bfa':'#8b5cf6';c.beginPath();c.arc(x,y,i===0?14:12,0,7);c.fill();
      if(i===0){const ex=g.dir.x*5,ey=g.dir.y*5;c.fillStyle='#fff';c.beginPath();c.arc(x+ex-g.dir.y*5,y+ey-g.dir.x*5,4,0,7);c.arc(x+ex+g.dir.y*5,y+ey+g.dir.x*5,4,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(x+ex*1.3-g.dir.y*5,y+ey*1.3-g.dir.x*5,2,0,7);c.arc(x+ex*1.3+g.dir.y*5,y+ey*1.3+g.dir.x*5,2,0,7);c.fill();}});
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 15: Spin & Spell ===== */
function createWheel(){
  const pool=wordPool(),AB='abcdefghijklmnopqrstuvwxyz',CX=180,CY=350,RAD=138;
  const T={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const SEGC=['#f87171','#fb923c','#facc15','#4ade80','#38bdf8','#818cf8','#c084fc','#f472b6'];
  const g={over:false,score:0,t:0,time:T,tmax:T,word:'',idx:0,ang:0,spd:1.3,dirn:1,segs:[],done:0,wait:0,wob:0,parts:[],pops:[]};
  g.intro=`The letter wheel spins! <b>Tap when the next letter is under the ▼ arrow</b> to spell the word at the top. A wrong tap costs 2 seconds. ${T} seconds!`;
  g.hud=()=>`🎡 ${plural(g.done,'word')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}`;
  g.endTitle='What a spinner!';
  const need=()=>g.word[g.idx];
  function build(){const u=[...new Set(g.word)];const n=Math.min(12,Math.max(8,u.length+3));const seg=u.slice();while(seg.length<n){const d=pick(AB);if(!seg.includes(d))seg.push(d);}g.segs=shuffle(seg);}
  function next(){g.word=pickWord(pool,g.word);g.idx=0;build();g.spd=Math.min(2.6,1.2+g.done*.06)*DF();speak(g.word);}
  const under=()=>{const n=g.segs.length,st=Math.PI*2/n;let a=(-Math.PI/2-g.ang)%(Math.PI*2);if(a<0)a+=Math.PI*2;return Math.round(a/st)%n;};
  g.begin=()=>next();
  g.tap=(x,y)=>{
    if(hitCircle(x,y,W-34,62,18)){speak(g.word);return;}
    if(g.wait>0)return;
    const L=g.segs[under()];
    if(L===need()){
      g.idx++;g.score+=1;sfx('pop');g.dirn*=-1;burst(g.parts,CX,CY-RAD,['#fde047','#fff','#f472b6'],14,160);
      if(g.idx>=g.word.length){g.done++;g.score+=g.word.length;g.time=Math.min(g.tmax+30,g.time+3);addPop(g.pops,`${g.word.toUpperCase()}! +${g.word.length}`,180,230,'#fde047',34);sfx('win');g.wait=.9;}
    }else{g.time=Math.max(0,g.time-2);g.wob=.35;sfx('nope');addPop(g.pops,`That was ${L.toUpperCase()} · need ${need().toUpperCase()}`,180,CY-RAD-40,'#fca5a5',20);}
  };
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)next();}
    g.wob=Math.max(0,g.wob-dt);
    g.ang+=g.spd*g.dirn*dt;
    stepParts(g.parts,dt,250);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1e3a8a');gr.addColorStop(1,'#7c3aed');c.fillStyle=gr;c.fillRect(0,0,W,H);
    for(let i=0;i<16;i++){c.fillStyle=`hsla(${(i*40+g.t*60)%360},90%,70%,.7)`;c.beginPath();c.arc(12+i*22.5,118,4,0,7);c.fill();}
    c.fillStyle='rgba(255,255,255,.95)';rr(c,10,10,W-20,84,18);c.fill();
    c.fillStyle='#6b7280';c.font='600 13px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(g.started?'TAP WHEN THE NEXT LETTER IS UNDER ▼':'GET READY',170,26);
    if(g.word){slotsPanel(c,58,g.word,i=>g.word[i],i=>i<g.idx?'#7c3aed':i===g.idx?'#f59e0b':'#d1d5db');roundBtn(c,W-34,62,18,'🔊');}
    const tf=Math.max(0,Math.min(1,g.time/g.tmax));c.fillStyle='rgba(255,255,255,.3)';rr(c,20,132,W-40,10,5);c.fill();c.fillStyle=tf>.3?'#86efac':'#fca5a5';rr(c,20,132,(W-40)*tf,10,5);c.fill();
    const n=g.segs.length,st=Math.PI*2/n,cur=under(),wx=g.wob>0?Math.sin(g.wob*50)*5:0;
    c.save();c.translate(CX+wx,CY);
    c.fillStyle='#fff';c.beginPath();c.arc(0,0,RAD+8,0,7);c.fill();
    for(let i=0;i<n;i++){const a=g.ang+i*st;
      c.fillStyle=SEGC[i%SEGC.length];c.beginPath();c.moveTo(0,0);c.arc(0,0,RAD,a-st/2,a+st/2);c.closePath();c.fill();
      if(i===cur){c.strokeStyle='#fff';c.lineWidth=5;c.stroke();}
      c.save();c.rotate(a);c.translate(RAD*.72,0);c.rotate(-a);
      c.fillStyle='#fff';c.font='700 28px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.25)';c.strokeText(g.segs[i].toUpperCase(),0,1);c.fillText(g.segs[i].toUpperCase(),0,1);
      c.restore();}
    c.fillStyle='#fff';c.beginPath();c.arc(0,0,26,0,7);c.fill();emo(c,'⭐',0,1,30);
    c.restore();
    c.fillStyle='#fde047';c.beginPath();c.moveTo(CX-16,CY-RAD-26);c.lineTo(CX+16,CY-RAD-26);c.lineTo(CX,CY-RAD+4);c.closePath();c.fill();c.strokeStyle='#92400e';c.lineWidth=2;c.stroke();
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}

/* ===== GAME 16: Letter Detective ===== */
function createDetective(){
  let pool=wordPool().filter(w=>w.length>=3);if(!pool.length)pool=wordPool();
  const VOW='aeiou',AB='abcdefghijklmnopqrstuvwxyz';
  const CONF={b:'dpv',d:'btg',p:'bqg',m:'nw',n:'mh',c:'ksq',k:'cg',s:'czx',f:'vth',v:'fw',g:'jqd',j:'gy',t:'dfl',r:'lw',l:'ri',w:'vr',y:'ij',h:'kn',x:'ks',z:'sx',q:'kg'};
  const T={easy:75,normal:60,hard:50}[S.set.diff]||60;
  const g={over:false,score:0,t:0,time:T,tmax:T,word:'',blanks:[],bi:0,filled:{},choices:[],streak:0,done:0,wait:0,wig:[0,0,0],parts:[],pops:[]};
  g.intro=`Some letters in the word are missing! 🔍 Listen to the word, then <b>tap the letter that fills the glowing blank</b>. Three right in a row earns bonus points. A wrong guess costs 2 seconds. ${T} seconds!`;
  g.hud=()=>`🔍 ${plural(g.done,'word')} · ⏱ ${Math.ceil(g.time)}s · ⭐ ${g.score}${g.streak>=3?' 🔥':''}`;
  g.endTitle='Case closed, detective!';
  const CHX=[70,180,290],CHY=420,CHR=44;
  function makeChoices(){
    const right=g.word[g.blanks[g.bi]];
    const src=VOW.includes(right)?VOW:(CONF[right]||'')+AB;
    const opts=[right];for(const ch of shuffle([...src])){if(opts.length>=3)break;if(!opts.includes(ch))opts.push(ch);}
    while(opts.length<3){const d=pick(AB);if(!opts.includes(d))opts.push(d);}
    g.choices=shuffle(opts);g.wig=[0,0,0];
  }
  function next(){
    g.word=pickWord(pool,g.word);const L=g.word.length,n=L<=4?1:L<=7?2:3;
    const idx=[...g.word].map((c,i)=>/[a-z]/.test(c)?i:-1).filter(i=>i>=0);
    g.blanks=shuffle(idx.slice()).slice(0,Math.min(n,idx.length)).sort((a,b)=>a-b);g.bi=0;g.filled={};makeChoices();speak(g.word);
  }
  g.begin=()=>next();
  g.tap=(x,y)=>{
    if(hitCircle(x,y,W-40,96,22)){speak(g.word);return;}
    if(g.wait>0)return;
    const i=CHX.findIndex(cx=>hitCircle(x,y,cx,CHY,CHR));if(i<0)return;
    const ch=g.choices[i],right=g.word[g.blanks[g.bi]];
    if(ch===right){
      g.filled[g.blanks[g.bi]]=ch;g.bi++;g.streak++;const pts=1+(g.streak>=3?1:0);g.score+=pts;sfx('pop');burst(g.parts,CHX[i],CHY,['#fde047','#fff'],12,150);
      if(g.streak===3)addPop(g.pops,'Streak! 🔥 double points',180,330,'#fb923c',22);
      if(g.bi>=g.blanks.length){g.done++;g.score+=g.word.length;g.time=Math.min(g.tmax+30,g.time+3);addPop(g.pops,`${g.word.toUpperCase()}! +${g.word.length}`,180,250,'#fde047',34);sfx('win');g.wait=1;}
      else makeChoices();
    }else{g.streak=0;g.wig[i]=.4;g.time=Math.max(0,g.time-2);sfx('nope');addPop(g.pops,'−2s',CHX[i],CHY-60,'#fca5a5',22);}
  };
  g.update=dt=>{
    g.t+=dt;g.time-=dt;if(g.time<=0){g.time=0;g.over=true;return;}
    if(g.wait>0){g.wait-=dt;if(g.wait<=0)next();}
    g.wig=g.wig.map(v=>Math.max(0,v-dt));
    stepParts(g.parts,dt,250);stepPops(g.pops,dt);
  };
  g.draw=c=>{
    const gr=c.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0f766e');gr.addColorStop(1,'#134e4a');c.fillStyle=gr;c.fillRect(0,0,W,H);
    for(let i=0;i<6;i++){c.fillStyle='rgba(255,255,255,.05)';c.fillRect(0,i*90+20,W,40);}
    const tf=Math.max(0,Math.min(1,g.time/g.tmax));c.fillStyle='rgba(255,255,255,.25)';rr(c,20,16,W-40,12,6);c.fill();c.fillStyle=tf>.3?'#fde047':'#fca5a5';rr(c,20,16,(W-40)*tf,12,6);c.fill();
    emo(c,'🕵️',44,96,44);label(c,'Find the missing letters!',190,56,20,'#fff');
    roundBtn(c,W-40,96,22,'🔊');
    if(g.word){
      const L=g.word.length,bw=Math.min(40,(W-30)/L),x0=(W-bw*L)/2;
      for(let i=0;i<L;i++){const x=x0+i*bw,isB=g.blanks.includes(i),cur=isB&&g.blanks[g.bi]===i&&g.wait<=0,shown=!isB||g.filled[i];
        c.fillStyle=cur?`rgba(253,224,71,${.55+.35*Math.sin(g.t*6)})`:(isB&&!g.filled[i])?'rgba(255,255,255,.18)':isB?'#dcfce7':'rgba(255,255,255,.92)';rr(c,x+2,170,bw-4,bw+10,8);c.fill();
        if(shown){c.fillStyle=isB?'#15803d':'#134e4a';c.font=`700 ${Math.floor(bw*.72)}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText((g.filled[i]||g.word[i]).toUpperCase(),x+bw/2,170+(bw+10)/2+1);}
        else{c.fillStyle='#fff';c.font=`700 ${Math.floor(bw*.6)}px Fredoka, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('?',x+bw/2,170+(bw+10)/2+1);}
      }
    }
    emo(c,'🔍',180,300,46);
    if(g.wait<=0)g.choices.forEach((ch,i)=>{const wx=g.wig[i]>0?Math.sin(g.wig[i]*40)*5:0,x=CHX[i]+wx;
      c.fillStyle='#fff';c.beginPath();c.arc(x,CHY,CHR,0,7);c.fill();c.strokeStyle='#fde047';c.lineWidth=5;c.stroke();
      c.fillStyle='#134e4a';c.font='700 42px Fredoka, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch.toUpperCase(),x,CHY+2);});
    drawParts(c,g.parts);drawPops(c,g.pops);
  };
  return g;
}


const GAMES={derby:createDerby,unicorn:createUnicorn,balloon:createBalloon,memory:createMemory,icecream:createIceCream,space:createSpace,bonk:createBonk,race:createRace,soccer:createSoccer,hoops:createHoops,catcher:createCatcher,moonrocket:createMoonRocket,scramble:createScramble,snake:createSnake,wheel:createWheel,detective:createDetective};
openGame(INIT.id);
post({t:'ready'});
</script>
